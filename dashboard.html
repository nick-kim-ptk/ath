<style>

}

  --bg:#0e0e10; --card:#1b1b1e; --ink:#f4f4f6; --ink2:#c4c4ca; --mute:#8b8b92; --line:#2a2a2e; --axis:#38383d; --chip:#2a2a2e;

:root[data-theme="dark"] {

details summary { cursor:pointer; font-weight:700; font-size:14px; color:var(--ink2); }

#tip b { font-weight:900; }

/* 데이터 수집 구조 */
.flow { display:flex; flex-wrap:wrap; align-items:center; gap:6px; font:800 13px "Plus Jakarta Sans","Noto Sans KR",sans-serif; }
.flow span { padding:7px 12px; border-radius:999px; background:var(--inset); }
.flow i { font-style:normal; color:var(--mute); }
.kpis { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px; }

.steps .no { width:28px; height:28px; border-radius:50%; background:var(--sel-bg); color:var(--sel-fg); display:grid; place-items:center; font:800 13px "Plus Jakarta Sans",sans-serif; }
.steps h3 { font-size:16px; font-weight:900; letter-spacing:-.03em; }

.funnel { display:flex; flex-direction:column; gap:10px; background:var(--inset); border-radius:18px; padding:16px; }
.fr { display:grid; grid-template-columns:104px minmax(0,1fr) 64px; gap:10px; align-items:center; font-size:13px; font-weight:700; }
.fr .bar2 { height:14px; border-radius:7px; background:var(--ink); min-width:6px; }
.fr .v { text-align:right; font:800 15px "Plus Jakarta Sans",sans-serif; }
.fr small { display:block; color:var(--mute); font-weight:500; font-size:11px; }
.steps .en { font:800 11px "Plus Jakarta Sans",sans-serif; letter-spacing:.12em; color:var(--mute); }
@media (max-width:480px) { .fr { grid-template-columns:84px minmax(0,1fr) 52px; } }
[hidden] { display:none !important; }
</style>
</head>
<body>


<div class="wrap">
  <header>
    <div class="brand"><span class="logo">ath ✦</span><span class="badge" id="badge"></span></div>
    <h1>오늘 지구는<br>어떤 기분일까요?</h1>
    <p class="sub">매일 자정, 19개국 사람들이 가장 많이 찾은 검색어를 모아서 분위기를 읽어요.</p>
  </header>

  <div class="filters" role="group" aria-label="보기 설정">
    <div class="seg" id="segRange"><button data-r="7">7일</button><button data-r="14">14일</button><button data-r="30">30일</button></div>
    <span class="sep"></span>
    <div class="seg" id="segBasis"><button data-b="n">검색어 수</button><button data-b="t">검색량</button></div>
    <select class="sel" id="selCc" aria-label="나라 선택"></select>
  </div>

  <div id="app"></div>

  <p class="note">· 화제로 뽑힌 것만이 아니라 그날 인기 검색어 전체(나라당 최대 25개)를 살펴봐요. 사건·사고 소식도 포함돼요.<br>
  · 분위기 지수 = 긍정 비율 − 부정 비율(%p). 분류는 관련 뉴스 제목을 바탕으로 자동으로 이뤄져서 오차가 있을 수 있어요.<br>
  · '검색량' 기준은 많이 검색된 항목이 더 크게 반영돼요.</p>
</div>
<div id="tip" role="tooltip"></div>

<script>
const SB_URL = 'https://wbmiszonrsxpjzbnppfz.supabase.co', SB_KEY = 'sb_publishable_J8EkuZW7bpB1MGXbHkz8WA_Yl26qAQX';
const CC_NAME = { KR:'한국', JP:'일본', US:'미국', FR:'프랑스', UK:'영국', IT:'이탈리아', BR:'브라질', AU:'호주', TH:'태국', DE:'독일', ES:'스페인', TR:'튀르키예', CA:'캐나다', MX:'멕시코', IN:'인도', ID:'인도네시아', VN:'베트남', SG:'싱가포르', TW:'대만' };
const S = { mode:'loading', rows:[], range:14, basis:'n', cc:'all', sel:null, terms:{}, sort:'pos', trends:[] };
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const pc = (n, tot) => tot ? n / tot * 100 : 0;
const f0 = x => Math.round(x) + '%';
const md = d => d.slice(5).replace('-', '.');
const kstToday = () => new Date(Date.now() + 9 * 3600e3).toISOString().slice(0, 10);
const addDays = (d, n) => new Date(Date.parse(d + 'T00:00:00Z') + n * 864e5).toISOString().slice(0, 10);
const fmtT = n => n >= 1e6 ? (n / 1e6).toFixed(n >= 1e7 ? 0 : 1) + 'M+' : n >= 1e3 ? Math.round(n / 1e3) + 'K+' : n + '+';
const sgn = x => (x > 0 ? '+' : x < 0 ? '−' : '') + Math.abs(x).toFixed(1);

/* ---------- 데이터 ---------- */
async function sbGet(path) {
  const r = await fetch(SB_URL + '/rest/v1/' + path, { headers: { apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY } });
  if (!r.ok) throw new Error(r.status);
  return r.json();
}
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function demoRows() {
  const r = rng(42), today = kstToday(), out = [];
  Object.keys(CC_NAME).forEach((cc, ci) => {
    const bias = (r() - .5) * .22;
    for (let k = 29; k >= 0; k--) {
      const day = addDays(today, -k), wave = Math.sin((k + ci) / 4) * .06, tot = 25;
      let neg = Math.max(2, Math.round(tot * (.3 + bias * -1 + wave + (r() - .5) * .12))), pos = Math.max(2, Math.round(tot * (.3 + bias + (r() - .5) * .12 - wave)));
      const neu = Math.max(0, tot - neg - pos), w = () => Math.round(40000 + r() * 400000);
      out.push({ day, cc, pos_n:pos, neu_n:neu, neg_n:neg, pos_t:pos * w(), neu_t:neu * w() * .6 | 0, neg_t:neg * w() });
    }
  });
  return out;
}
const DEMO_POS = ['월드시리즈 우승', '신형 스마트폰 출시', '가을 축제 개막', '국가대표 4강 진출', '노벨상 수상 소식', '신메뉴 출시', '콘서트 티켓팅', '주가 사상 최고'];
const DEMO_NEG = ['폭우 경보', '대형 화재 속보', '항공편 대규모 결항', '물가 급등', '교통사고 소식', '정전 사태', '감염병 확산', '공장 파업'];
function demoTerms(day) {
  const r = rng(day.split('-').join('') | 0), ccs = Object.keys(CC_NAME), pick = a => a[Math.floor(r() * a.length)];
  const mk = (pool, s) => Array.from({ length:12 }, () => { const t = pick(pool); return { cc:pick(ccs), term:t, term_ko:t, traffic:Math.round(20000 + r() * 900000), sentiment:s, summary_ko:'(샘플) 한국어로 정리한 한 줄 요약이 여기에 표시돼요', headline:'Sample headline in the original language' }; }).sort((a, b) => b.traffic - a.traffic);
  return [...mk(DEMO_POS, 'positive'), ...mk(DEMO_NEG, 'negative')];
}
async function loadTrends() {
  if (S.mode === 'demo') { const r = rng(7), ccs = Object.keys(CC_NAME), out = []; ccs.forEach(cc => { for (let i = 0; i < 4; i++) out.push({ cc, keyword_id: 'k' + (r() < .08 ? Math.floor(r() * 5) : cc + i) }); }); return out; }
  try { return await sbGet('trends?select=cc,keyword_id&is_sample=eq.false&limit=500'); } catch (e) { return []; }
}
async function termsFor(day) {
  if (S.terms[day]) return S.terms[day];
  let v = [];
  const q = cols => `sentiment_daily?select=${cols}&day=eq.${day}&sentiment=in.(positive,negative)&order=traffic.desc&limit=400`;
  try { v = S.mode === 'demo' ? demoTerms(day) : await sbGet(q('cc,term,traffic,sentiment,headline,term_ko,summary_ko')); }
  catch (e) { try { v = await sbGet(q('cc,term,traffic,sentiment,headline')); } catch (e2) { v = []; } }
  return (S.terms[day] = v);
}

/* ---------- 집계 ---------- */
const days = () => [...new Set(S.rows.map(r => r.day))].sort().slice(-S.range);
function agg(day, cc = S.cc) {
  const k = S.basis === 'n' ? '_n' : '_t', o = { pos:0, neu:0, neg:0 };
  S.rows.forEach(r => { if (r.day === day && (cc === 'all' || r.cc === cc)) { o.pos += +r['pos' + k]; o.neu += +r['neu' + k]; o.neg += +r['neg' + k]; } });
  o.tot = o.pos + o.neu + o.neg; o.P = pc(o.pos, o.tot); o.U = pc(o.neu, o.tot); o.N = pc(o.neg, o.tot); o.net = o.P - o.N;
  return o;
}
const mood = net => net >= 10 ? '대체로 밝은 하루' : net <= -10 ? '무거운 소식이 많은 하루' : '밝은 소식과 무거운 소식이 비슷해요';

/* ---------- 툴팁 ---------- */
const tip = $('#tip');
function showTip(html, x, y) {
  tip.innerHTML = html; tip.style.display = 'block';
  const w = tip.offsetWidth, h = tip.offsetHeight;
  tip.style.left = Math.max(8, Math.min(innerWidth - w - 8, x + 14)) + 'px';
  tip.style.top = Math.max(8, Math.min(innerHeight - h - 8, y - h - 10)) + 'px';
}
const hideTip = () => { tip.style.display = 'none'; };

/* ---------- 그리기 ---------- */
const josa = w => { const c = w.charCodeAt(w.length - 1); return c >= 0xAC00 && c <= 0xD7A3 && (c - 0xAC00) % 28 ? '은' : '는'; };
const kindOf = net => net >= 10 ? 'p' : net <= -10 ? 'n' : 'u';
function faceSVG(k) {
  const bg = { p:'var(--pos)', u:'var(--neu)', n:'var(--neg)' }[k], ink = k === 'u' ? 'var(--face-neu-ink)' : '#ffffff';
  const eyes = `<circle cx="35" cy="43" r="4.8" fill="${ink}"/><circle cx="65" cy="43" r="4.8" fill="${ink}"/>`;
  const m = { p:`<path d="M33 59 Q50 80 67 59" fill="none" stroke="${ink}" stroke-width="4.8" stroke-linecap="round"/><circle cx="23" cy="58" r="6" fill="#aeff1c"/><circle cx="77" cy="58" r="6" fill="#aeff1c"/>`,
    u:`<path d="M38 67 H62" fill="none" stroke="${ink}" stroke-width="4.8" stroke-linecap="round"/>`,
    n:`<path d="M27 37 L42 31 M73 37 L58 31" fill="none" stroke="${ink}" stroke-width="4.2" stroke-linecap="round"/><path d="M36 72 Q50 56 64 72" fill="none" stroke="${ink}" stroke-width="4.8" stroke-linecap="round"/>` }[k];
  return `<svg class="face" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="46" fill="${bg}"/>${eyes}${m}</svg>`;
}
function kpiHTML(d, prev, latest) {
  const a = agg(d), p = prev ? agg(prev) : null, k = kindOf(a.net), subj = S.cc === 'all' ? '지구' : CC_NAME[S.cc];
  const title = (d === latest ? '오늘 ' : md(d) + '의 ') + subj + josa(subj) + ' ' + { p:'기분이 좋아요', u:'반반이에요', n:'조금 무거워요' }[k];
  const dl = (cur, old) => p ? `${cur - old >= 0.05 ? '▲' : cur - old <= -0.05 ? '▼' : '–'} 전날보다 ${Math.abs(cur - old).toFixed(1)}%p` : '전날 데이터 없음';
  const tile = (c, label, val, cur, old) => `<div class="tile ${c}"><span class="k"><i class="sw" style="background:var(--${{ p:'pos', u:'neu', n:'neg' }[c]})"></i>${label}</span><span class="v num">${f0(val)}</span><span class="d">${dl(cur, old)}</span></div>`;
  const seg = (cls, v, lab) => v >= 0.5 ? `<div class="${cls}" title="${lab} ${f0(v)}" style="flex:${v}">${v >= 24 ? lab + ' ' + f0(v) : v >= 9 ? f0(v) : ''}</div>` : '';
  return `<div class="mood ${k}"><div class="mood-top">${faceSVG(k)}<div><p class="when num">${md(d)} · 분위기 지수 ${sgn(a.net)}</p><h2>${title}</h2></div></div>
      <div class="bar" role="img" aria-label="긍정 ${f0(a.P)}, 중립 ${f0(a.U)}, 부정 ${f0(a.N)}">${seg('p', a.P, '긍정')}${seg('u', a.U, '중립')}${seg('n', a.N, '부정')}</div>
      <p class="cap" style="margin:0">${S.basis === 'n' ? '검색어 수' : '검색량'} 기준 · 아래 그래프에서 날짜를 눌러 바꿔 볼 수 있어요</p></div>
    <div class="tiles">${tile('p', '긍정', a.P, a.P, p ? p.P : 0)}${tile('u', '중립', a.U, a.U, p ? p.U : 0)}${tile('n', '부정', a.N, a.N, p ? p.N : 0)}</div>`;
}

let TW = 720, PR = 74; const TH = 250, PL = 40, PT = 14, PB = 28;
function trendHTML(ds) {
  const vals = ds.map(d => agg(d)), maxV = Math.max(20, Math.ceil(Math.max(...vals.map(v => Math.max(v.P, v.N))) / 10) * 10);
  const X = i => ds.length === 1 ? (PL + TW - PR) / 2 : PL + i * (TW - PL - PR) / (ds.length - 1), Y = v => PT + (1 - v / maxV) * (TH - PT - PB);
  const grid = [0, maxV / 2, maxV].map(t => `<line x1="${PL}" x2="${TW - PR}" y1="${Y(t)}" y2="${Y(t)}" stroke="${t ? 'var(--line)' : 'var(--axis)'}" stroke-width="1.5" stroke-linecap="round"/><text x="${PL - 8}" y="${Y(t) + 4}" text-anchor="end" font-size="12" fill="var(--mute)" class="num">${t}%</text>`).join('');
  const step = Math.max(1, Math.ceil(ds.length / 6)), xl = ds.map((d, i) => ((i % step === 0 && (ds.length - 1 - i >= step || i === ds.length - 1)) || i === ds.length - 1) ? `<text x="${X(i)}" y="${TH - 6}" text-anchor="middle" font-size="12" fill="var(--mute)" class="num">${md(d)}</text>` : '').join('');
  const line = (key, col) => ds.length > 1 ? `<polyline fill="none" stroke="var(--${col})" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" points="${vals.map((v, i) => X(i) + ',' + Y(v[key])).join(' ')}"/>` : '';
  const si = ds.indexOf(S.sel), last = vals[vals.length - 1];
  const dot = (i, key, col) => `<circle cx="${X(i)}" cy="${Y(vals[i][key])}" r="6" fill="var(--${col})" stroke="var(--card)" stroke-width="3"/>`;
  const endLab = (key, name, off) => `<text x="${TW - PR + 10}" y="${Y(last[key]) + off}" font-size="13" font-weight="800" fill="var(--ink)">${name} ${f0(last[key])}</text>`;
  const gap = Math.abs(Y(last.P) - Y(last.N)) < 16 ? 8 : 0;
  return `<div class="card"><div class="legend"><span><i class="sw" style="background:var(--pos)"></i>긍정 비율</span><span><i class="sw" style="background:var(--neg)"></i>부정 비율</span></div>
    <svg class="chart" id="trend" viewBox="0 0 ${TW} ${TH}" role="img" aria-label="날짜별 긍정과 부정 비율 추이">${grid}${xl}
      ${si >= 0 ? `<line x1="${X(si)}" x2="${X(si)}" y1="${PT}" y2="${TH - PB}" stroke="var(--axis)" stroke-width="2" stroke-dasharray="2 6" stroke-linecap="round"/>` : ''}
      ${line('P', 'pos')}${line('N', 'neg')}
      ${ds.length === 1 ? dot(0, 'P', 'pos') + dot(0, 'N', 'neg') : si >= 0 ? dot(si, 'P', 'pos') + dot(si, 'N', 'neg') : ''}
      ${endLab('P', '긍정', last.P >= last.N ? -gap : gap + 4)}${endLab('N', '부정', last.P >= last.N ? gap + 10 : -gap + 2)}
      <line id="xh" x1="0" x2="0" y1="${PT}" y2="${TH - PB}" stroke="var(--ink2)" stroke-width="1.5" style="display:none"/>
      <rect id="hit" x="${PL - 10}" y="0" width="${TW - PL - PR + 20}" height="${TH}" fill="transparent"/></svg>
    ${ds.length < 3 ? '<p class="hint">데이터가 쌓이면 흐름이 더 또렷하게 보여요. (지금 ' + ds.length + '일치)</p>' : ''}
    <details><summary>표로 보기</summary><div class="tablewrap"><table><thead><tr><th>날짜</th><th>긍정</th><th>중립</th><th>부정</th><th>지수</th></tr></thead><tbody>
      ${[...ds].reverse().map(d => { const a = agg(d); return `<tr><td>${d}</td><td>${f0(a.P)}</td><td>${f0(a.U)}</td><td>${f0(a.N)}</td><td>${sgn(a.net)}</td></tr>`; }).join('')}</tbody></table></div></details></div>`;
}

function countryHTML(d) {
  const ccs = [...new Set(S.rows.filter(r => r.day === d).map(r => r.cc))];
  const list = ccs.map(cc => ({ cc, a: agg(d, cc) })).filter(x => x.a.tot).sort((x, y) => S.sort === 'neg' ? y.a.N - x.a.N : y.a.P - x.a.P);
  return `<div class="card"><div class="seg sm" id="segSort"><button data-s="pos" aria-pressed="${S.sort === 'pos'}">긍정 많은 순</button><button data-s="neg" aria-pressed="${S.sort === 'neg'}">부정 많은 순</button></div>
    <div class="legend"><span><i class="sw" style="background:var(--pos)"></i>긍정</span><span><i class="sw" style="background:var(--neu)"></i>중립</span><span><i class="sw" style="background:var(--neg)"></i>부정</span></div>
    <div class="rows">${list.map(({ cc, a }) => `<div class="row" data-cc="${cc}"><span class="nm">${CC_NAME[cc] || cc}</span><div class="rbar" role="img" aria-label="${CC_NAME[cc]} 긍정 ${f0(a.P)} 중립 ${f0(a.U)} 부정 ${f0(a.N)}">${a.P > 0 ? `<div class="p" style="flex:${a.P}"></div>` : ''}${a.U > 0 ? `<div class="u" style="flex:${a.U}"></div>` : ''}${a.N > 0 ? `<div class="n" style="flex:${a.N}"></div>` : ''}</div><span class="fig num">${f0(S.sort === 'neg' ? a.N : a.P)}</span></div>`).join('') || '<p class="hint">이 날짜의 데이터가 없어요.</p>'}</div></div>`;
}

function termsHTML(d, v) {
  const f = v.filter(x => S.cc === 'all' || x.cc === S.cc);
  const col = (s, title, col) => { const it = f.filter(x => x.sentiment === s).slice(0, 6);
    return `<div><div class="sec-h"><i class="sw" style="background:var(--${col})"></i>${title}</div><ul class="list">${it.map((x, i) => { const ko = x.term_ko && x.term_ko.trim(), main = ko || x.term, orig = ko && ko.toLowerCase() !== String(x.term).toLowerCase() ? x.term : '', sum = x.summary_ko || ''; return `<li><span class="rk num">${i + 1}</span><span class="t" title="${esc(main)}"><span class="cc">${x.cc}</span>${esc(main)}</span><span class="tr num">${fmtT(+x.traffic)}</span>${sum ? `<span class="hl2">${esc(sum)}</span>` : (x.headline && !ko ? `<span class="hl">${esc(x.headline)}</span>` : '')}${orig ? `<span class="orig">원문 · ${esc(orig)}</span>` : ''}</li>`; }).join('') || '<li><span class="hint" style="grid-column:1/4">해당하는 검색어가 없어요.</span></li>'}</ul></div>`; };
  return `<section><h2>${md(d)}에 많이 찾은 소식</h2><p class="cap">검색량이 큰 순서로, 한국어로 정리해서 보여줘요. 원문 검색어는 아래에 작게 표시돼요.</p><div class="card two">${col('positive', '반가운 소식 · 긍정', 'pos')}${col('negative', '걱정되는 소식 · 부정', 'neg')}</div></section>`;
}

function pipelineHTML(d) {
  const day = S.rows.filter(r => r.day === d), total = day.reduce((t, r) => t + (+r.pos_n) + (+r.neu_n) + (+r.neg_n), 0);
  const nCc = new Set(day.map(r => r.cc)).size, allDays = [...new Set(S.rows.map(r => r.day))].sort(), nDays = allDays.length, last = allDays[allDays.length - 1];
  const tr = S.trends || [], topics = tr.length, byKw = {}; tr.forEach(t => { (byKw[t.keyword_id] = byKw[t.keyword_id] || new Set()).add(t.cc); });
  const shared = Object.values(byKw).filter(x => x.size >= 2).length, max = Math.max(total, 1);
  const frow = (name, sub, n, op) => `<div class="fr"><span>${name}<small>${sub}</small></span><div class="bar2" style="width:${Math.max(3, n / max * 100)}%;opacity:${op}"></div><span class="v">${n.toLocaleString()}</span></div>`;
  const step = (n, en, t, p, em) => `<li><span class="no">${n}</span><span class="en">${en}</span><h3>${t}</h3><p>${p}</p><em>${em}</em></li>`;
  return `<section><h2>데이터는 이렇게 모여요</h2><p class="cap">사람이 고르지 않고, 매일 같은 순서로 자동으로 쌓여요.${S.mode === 'demo' ? ' (지금 숫자는 샘플이에요)' : ''}</p>
    <div class="card"><div class="kpis"><div><b class="num">${nCc}</b><small>대상 국가</small></div><div><b class="num">${nDays}</b><small>쌓인 날짜</small></div><div><b class="num">${md(last)}</b><small>최근 수집일</small></div></div>
    ${topics ? `<div class="funnel"><div class="sec-h" style="margin:0">${md(d)} 처리량</div>
      ${frow('분석한 검색어', '전체 인기 검색어', total, 1)}${frow('오늘의 화제', '앱에 노출 중', topics, .6)}${frow('공통 화제', '2개국 이상 동시', shared, .35)}</div>` : ''}
    <ol class="steps">
      ${step(1, 'INGEST', '수집', '구글 트렌드의 나라별 일간 인기 검색어와 연관 뉴스 제목을 가져와요.', '19개국 · 매일 00:00 (한국 시간)')}
      ${step(2, 'CLEAN', '정제', '도구성 검색어와 중복을 걸러내고 같은 사건은 하나로 병합해요. 나라가 달라도 같은 이야기면 한 키워드로 묶어요.', '근거 없는 요약은 제외')}
      ${step(3, 'CLASSIFY', '분석', '뉴스 제목을 근거로 검색어마다 긍정·중립·부정을 판정해요. 근거가 모호하면 중립으로 둬요.', '나라당 최대 25개 · 사건·사고 포함')}
      ${step(4, 'STORE', '적재', '하루 단위 스냅샷으로 저장해서 날짜별 추이와 나라별 비교를 계산해요.', '앱과 대시보드가 같은 데이터를 사용')}
    </ol>
    <p class="hint">중국은 수집 가능한 공개 데이터가 없어 제외돼요. 분류는 자동으로 이뤄져 오차가 있을 수 있어요.</p></div></section>`;
}

async function render() {
  const app = $('#app');
  { const w = Math.round($('.wrap').clientWidth - 46); TW = Math.max(300, Math.min(680, w)); PR = TW < 480 ? 66 : 76; }
  $('#badge').textContent = S.mode === 'demo' ? '샘플 데이터 · 미리보기' : S.mode === 'live' ? '실제 데이터' : '';
  $('#badge').className = 'badge' + (S.mode === 'demo' ? ' demo' : '');
  $('#badge').hidden = S.mode === 'loading' || S.mode === 'empty';
  document.querySelectorAll('#segRange button').forEach(b => b.setAttribute('aria-pressed', +b.dataset.r === S.range));
  document.querySelectorAll('#segBasis button').forEach(b => b.setAttribute('aria-pressed', b.dataset.b === S.basis));
  if (S.mode === 'loading') { app.innerHTML = '<div class="card"><p class="hint">불러오는 중이에요…</p></div>'; return; }
  if (S.mode === 'empty') { app.innerHTML = `<div class="card"><div class="empty">${faceSVG('u')}<b>아직 모인 소식이 없어요</b><span>자동 수집이 한 번 돌고 나면 여기에 분위기가 나타나요.</span><button class="btn" id="goDemo">샘플로 미리 보기</button></div></div>`; $('#goDemo').onclick = () => { S.mode = 'demo'; S.rows = demoRows(); S.sel = null; loadTrends().then(t => { S.trends = t; render(); }); }; return; }
  const ds = days(); if (!ds.length) { app.innerHTML = '<div class="card"><p class="hint">선택한 조건의 데이터가 없어요.</p></div>'; return; }
  if (!S.sel || !ds.includes(S.sel)) S.sel = ds[ds.length - 1];
  const prev = ds[ds.indexOf(S.sel) - 1] || null, token = (S.tok = (S.tok || 0) + 1);
  app.innerHTML = `<div style="display:flex;flex-direction:column;gap:26px">
    <section>${kpiHTML(S.sel, prev, ds[ds.length - 1])}</section>
    <section><h2>하루하루는 어땠을까요?</h2><p class="cap">그래프를 누르거나 손가락으로 움직여 날짜를 골라 보세요.</p>${trendHTML(ds)}</section>
    <section><h2>나라별로 보면</h2><p class="cap">${md(S.sel)} 기준 · 왼쪽부터 긍정, 중립, 부정 · 오른쪽 숫자는 ${S.sort === 'neg' ? '부정' : '긍정'} 비율 · 나라를 누르면 그 나라만 봐요.</p>${countryHTML(S.sel)}</section>
    <div id="termsSlot"></div>
    ${pipelineHTML(S.sel)}</div>`;
  document.querySelectorAll('.cc-note').forEach(e => e.remove());
  bindTrend(ds); bindRows();
  document.querySelectorAll('#segSort button').forEach(b => b.onclick = () => { S.sort = b.dataset.s; render(); });
  const v = await termsFor(S.sel); if (token === S.tok) $('#termsSlot').innerHTML = termsHTML(S.sel, v);
}

function bindTrend(ds) {
  const svg = $('#trend'), hit = $('#hit'), xh = $('#xh'); if (!svg) return;
  const X = i => ds.length === 1 ? (PL + TW - PR) / 2 : PL + i * (TW - PL - PR) / (ds.length - 1);
  const idxAt = e => { const r = svg.getBoundingClientRect(), x = (e.clientX - r.left) / r.width * TW; let b = 0, bd = 1e9; ds.forEach((_, i) => { const d = Math.abs(X(i) - x); if (d < bd) { bd = d; b = i; } }); return b; };
  const move = e => { const i = idxAt(e), a = agg(ds[i]); xh.setAttribute('x1', X(i)); xh.setAttribute('x2', X(i)); xh.style.display = '';
    showTip(`<b>${ds[i]}</b><br>긍정 ${f0(a.P)} · 중립 ${f0(a.U)} · 부정 ${f0(a.N)}<br>지수 ${sgn(a.net)}%p`, e.clientX, e.clientY); };
  hit.addEventListener('pointermove', move); hit.addEventListener('pointerdown', move);
  hit.addEventListener('pointerleave', () => { xh.style.display = 'none'; hideTip(); });
  hit.addEventListener('click', e => { S.sel = ds[idxAt(e)]; hideTip(); render(); });
}
function bindRows() {
  document.querySelectorAll('.row').forEach(el => {
    const show = e => { const a = agg(S.sel, el.dataset.cc), k = S.basis === 'n' ? '건' : '';
      showTip(`<b>${CC_NAME[el.dataset.cc]}</b><br>부정 ${f0(a.N)} · 중립 ${f0(a.U)} · 긍정 ${f0(a.P)}<br>지수 ${sgn(a.net)}%p`, e.clientX, e.clientY); };
    el.addEventListener('pointermove', show); el.addEventListener('pointerleave', hideTip);
    el.addEventListener('click', () => { S.cc = S.cc === el.dataset.cc ? 'all' : el.dataset.cc; $('#selCc').value = S.cc; hideTip(); render(); });
  });
}

/* ---------- 시작 ---------- */
$('#selCc').innerHTML = '<option value="all">전체 나라</option>' + Object.entries(CC_NAME).map(([k, v]) => `<option value="${k}">${v}</option>`).join('');
$('#selCc').onchange = e => { S.cc = e.target.value; render(); };
$('#segRange').onclick = e => { const b = e.target.closest('button'); if (b) { S.range = +b.dataset.r; render(); } };
$('#segBasis').onclick = e => { const b = e.target.closest('button'); if (b) { S.basis = b.dataset.b; render(); } };
let _rw = 0; addEventListener('resize', () => { const w = $('.wrap').clientWidth; if (Math.abs(w - _rw) > 40 && S.mode !== 'loading') { _rw = w; render(); } });
(async () => {
  _rw = $('.wrap').clientWidth; render();
  const demo = new URLSearchParams(location.search).has('demo');
  if (demo) { S.mode = 'demo'; S.rows = demoRows(); S.trends = await loadTrends(); return render(); }
  try {
    const rows = await sbGet(`sentiment_daily_stats?select=*&day=gte.${addDays(kstToday(), -35)}&order=day.asc&limit=1000`);
    if (!rows.length) { S.mode = 'empty'; } else { S.mode = 'live'; S.rows = rows; S.trends = await loadTrends(); }
  } catch (e) { S.mode = 'demo'; S.rows = demoRows(); S.trends = await loadTrends(); }   // 연결이 안 되면(미리보기·표 미생성) 샘플로 보여줘요
  render();
})();
</script>

</body>
</html>
