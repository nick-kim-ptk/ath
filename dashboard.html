<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>화제 분위기 대시보드</title>
</head>
<body>

<style>
:root {
  --bg:#f6f6f3; --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --mute:#898781;
  --line:#e1e0d9; --axis:#c3c2b7; --ring:rgba(11,11,11,.10);
  --pos:#2a78d6; --neg:#e34948; --neu:#d4d3cb; --on-fill:#ffffff; --on-neu:#0b0b0b;
  --lime:#aeff1c; --chip:#eceae4;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg:#0d0d0d; --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --mute:#898781;
  --line:#2c2c2a; --axis:#383835; --ring:rgba(255,255,255,.10);
  --pos:#3987e5; --neg:#e66767; --neu:#55544f; --on-fill:#ffffff; --on-neu:#f0efec; --chip:#262624; color-scheme:dark; } }
:root[data-theme="dark"] {
  --bg:#0d0d0d; --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --mute:#898781;
  --line:#2c2c2a; --axis:#383835; --ring:rgba(255,255,255,.10);
  --pos:#3987e5; --neg:#e66767; --neu:#55544f; --on-fill:#ffffff; --on-neu:#f0efec; --chip:#262624; color-scheme:dark; }

* { box-sizing:border-box; }
body { background:var(--bg); color:var(--ink); font:400 14px/1.5 system-ui,-apple-system,"Segoe UI","Apple SD Gothic Neo","Noto Sans KR",sans-serif; padding-inline:16px; padding-block:20px 56px; }
.wrap { max-width:960px; margin:0 auto; display:flex; flex-direction:column; gap:14px; }
button { font:inherit; color:inherit; background:none; border:0; cursor:pointer; padding:0; }
h1,h2,h3,p { margin:0; }
.tabnum { font-variant-numeric:tabular-nums; }

header { display:flex; flex-direction:column; gap:10px; padding-block:6px 4px; }
.brand { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
.logo { background:#0b0b0b; color:var(--lime); font:800 13px/1 system-ui,sans-serif; letter-spacing:.02em; padding:6px 10px; border-radius:999px; }
.badge { font:700 11px/1 system-ui; letter-spacing:.06em; padding:6px 9px; border-radius:999px; background:var(--chip); color:var(--ink2); }
.badge.demo { background:#fff3c4; color:#5c4300; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .badge.demo { background:#4a3a08; color:#ffe9a0; } }
:root[data-theme="dark"] .badge.demo { background:#4a3a08; color:#ffe9a0; }
h1 { font-size:clamp(26px,6vw,36px); line-height:1.15; letter-spacing:-.03em; font-weight:800; text-wrap:balance; }
.sub { color:var(--ink2); max-width:62ch; }

.filters { display:flex; flex-wrap:wrap; gap:8px 12px; align-items:center; }
.seg { display:inline-flex; padding:3px; gap:2px; border-radius:10px; background:var(--chip); }
.seg button { height:30px; padding:0 12px; border-radius:7px; font-weight:600; font-size:13px; color:var(--ink2); }
.seg button[aria-pressed="true"] { background:var(--surface); color:var(--ink); box-shadow:0 1px 3px rgba(0,0,0,.14); }
.sel { height:36px; border-radius:10px; border:1px solid var(--ring); background:var(--surface); color:var(--ink); padding:0 10px; font:inherit; font-size:13px; font-weight:600; }
.fl { font-size:12px; color:var(--mute); font-weight:600; }

.card { background:var(--surface); border:1px solid var(--ring); border-radius:16px; padding:18px; display:flex; flex-direction:column; gap:14px; min-width:0; }
.card h2 { font-size:16px; font-weight:800; letter-spacing:-.02em; }
.cap { color:var(--mute); font-size:12px; }
.head { display:flex; justify-content:space-between; align-items:flex-start; gap:10px; flex-wrap:wrap; }

.hero { display:flex; flex-wrap:wrap; gap:6px 18px; align-items:baseline; }
.hero .big { font-size:clamp(44px,12vw,64px); line-height:1; font-weight:800; letter-spacing:-.04em; }
.hero .mood { font-size:17px; font-weight:700; letter-spacing:-.02em; }
.tiles { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px; }
.tile { border:1px solid var(--ring); border-radius:12px; padding:12px; display:flex; flex-direction:column; gap:2px; min-width:0; }
.tile .k { display:flex; align-items:center; gap:6px; font-size:12px; font-weight:700; color:var(--ink2); }
.sw { width:10px; height:10px; border-radius:3px; flex:none; }
.tile .v { font-size:clamp(24px,6vw,32px); font-weight:800; letter-spacing:-.03em; line-height:1.1; }
.tile .d { font-size:12px; color:var(--mute); }

.bar { display:flex; gap:2px; height:44px; border-radius:10px; overflow:hidden; }
.bar > div { display:flex; align-items:center; justify-content:center; font-weight:800; font-size:13px; min-width:0; white-space:nowrap; overflow:hidden; }
.bar .p { background:var(--pos); color:var(--on-fill); } .bar .n { background:var(--neg); color:var(--on-fill); } .bar .u { background:var(--neu); color:var(--on-neu); }

.legend { display:flex; flex-wrap:wrap; gap:6px 16px; font-size:12px; font-weight:600; color:var(--ink2); }
.legend span { display:inline-flex; align-items:center; gap:6px; }

svg text { font-family:inherit; }
.chart { width:100%; height:auto; display:block; touch-action:pan-y; }
.hint { color:var(--mute); font-size:12px; }

.rows { display:flex; flex-direction:column; gap:8px; }
.row { display:grid; grid-template-columns:76px minmax(0,1fr) 54px; gap:10px; align-items:center; }
.row .nm { font-weight:700; font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.row .fig { text-align:right; font-size:12px; color:var(--ink2); font-weight:700; }
.rbar { display:flex; gap:2px; height:22px; }
.rbar > div { min-width:0; } .rbar .n { background:var(--neg); border-radius:5px 0 0 5px; } .rbar .u { background:var(--neu); } .rbar .p { background:var(--pos); border-radius:0 5px 5px 0; }
.rbar > div:only-child { border-radius:5px; }

.two { display:grid; grid-template-columns:1fr 1fr; gap:18px; }
@media (max-width:640px) { .two { grid-template-columns:1fr; } .tiles { gap:8px; } .tile { padding:10px; } }
.list { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; }
.list li { display:grid; grid-template-columns:auto minmax(0,1fr) auto; gap:4px 10px; padding:10px 0; border-top:1px solid var(--line); align-items:baseline; }
.list li:first-child { border-top:0; }
.cc { font:700 11px/1 system-ui; letter-spacing:.04em; padding:4px 6px; border-radius:6px; background:var(--chip); color:var(--ink2); }
.t { font-weight:700; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.tr { font-size:12px; color:var(--mute); }
.hl { grid-column:2 / 4; font-size:12px; color:var(--mute); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.sec-h { display:flex; align-items:center; gap:8px; font-weight:800; font-size:14px; }

details summary { cursor:pointer; font-weight:700; font-size:13px; color:var(--ink2); }
.tablewrap { overflow-x:auto; margin-top:10px; }
table { border-collapse:collapse; width:100%; min-width:420px; font-size:13px; }
th,td { text-align:right; padding:7px 8px; border-bottom:1px solid var(--line); font-variant-numeric:tabular-nums; }
th:first-child,td:first-child { text-align:left; } th { color:var(--mute); font-weight:700; font-size:12px; }

.empty { text-align:center; padding:28px 12px; color:var(--ink2); display:flex; flex-direction:column; gap:10px; align-items:center; }
.empty b { color:var(--ink); font-size:16px; }
.btn { height:36px; padding:0 16px; border-radius:999px; background:var(--ink); color:var(--bg); font-weight:700; font-size:13px; }
.note { font-size:12px; color:var(--mute); line-height:1.6; }
#tip { position:fixed; z-index:20; pointer-events:none; background:var(--ink); color:var(--bg); border-radius:10px; padding:8px 10px; font-size:12px; line-height:1.5; display:none; max-width:240px; box-shadow:0 6px 20px rgba(0,0,0,.25); }
#tip b { font-weight:800; }
[hidden] { display:none !important; }
</style>

<div class="wrap">
  <header>
    <div class="brand"><span class="logo">ath ✦</span><span class="badge" id="badge"></span></div>
    <h1>지금 지구의 분위기</h1>
    <p class="sub">매일 자정에 모은 19개국 인기 검색어를 AI가 긍정·중립·부정으로 나눠서 보여줘요.</p>
  </header>

  <div class="filters" role="group" aria-label="보기 설정">
    <span class="fl">기간</span>
    <div class="seg" id="segRange"><button data-r="7">7일</button><button data-r="14">14일</button><button data-r="30">30일</button></div>
    <span class="fl">기준</span>
    <div class="seg" id="segBasis"><button data-b="n">검색어 수</button><button data-b="t">검색량</button></div>
    <select class="sel" id="selCc" aria-label="나라 선택"></select>
  </div>

  <div id="app"></div>

  <p class="note">· 화제로 뽑힌 항목만이 아니라 그날 구글 트렌드 인기 검색어 전체(나라당 최대 25개)를 분류해요. 사건·사고도 포함돼요.<br>
  · 분위기 지수 = 긍정 비율 − 부정 비율(%p). 분류는 관련 뉴스 제목만 보고 AI가 하기 때문에 오차가 있을 수 있어요.<br>
  · '검색량' 기준은 검색량이 큰 항목이 더 크게 반영돼요.</p>
</div>
<div id="tip" role="tooltip"></div>

<script>
const SB_URL = 'https://wbmiszonrsxpjzbnppfz.supabase.co', SB_KEY = 'sb_publishable_J8EkuZW7bpB1MGXbHkz8WA_Yl26qAQX';
const CC_NAME = { KR:'한국', JP:'일본', US:'미국', FR:'프랑스', UK:'영국', IT:'이탈리아', BR:'브라질', AU:'호주', TH:'태국', DE:'독일', ES:'스페인', TR:'튀르키예', CA:'캐나다', MX:'멕시코', IN:'인도', ID:'인도네시아', VN:'베트남', SG:'싱가포르', TW:'대만' };
const S = { mode:'loading', rows:[], range:14, basis:'n', cc:'all', sel:null, terms:{}, sort:'neg' };
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const pc = (n, tot) => tot ? n / tot * 100 : 0;
const f0 = x => Math.round(x) + '%';
const md = d => d.slice(5).replace('-', '.');
const kstToday = () => new Date(Date.now() + 9 * 3600e3).toISOString().slice(0, 10);
const addDays = (d, n) => new Date(Date.parse(d + 'T00:00:00Z') + n * 864e5).toISOString().slice(0, 10);
const fmtT = n => n >= 1e6 ? (n / 1e6).toFixed(n >= 1e7 ? 0 : 1) + 'M+' : n >= 1e3 ? Math.round(n / 1e3) + 'K+' : n + '+';
const sgn = x => (x > 0 ? '+' : x < 0 ? '−' : '') + Math.abs(x).toFixed(1);

/* ---------- 데이터 ---------- */
async function sbGet(path) {
  const r = await fetch(SB_URL + '/rest/v1/' + path, { headers: { apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY } });
  if (!r.ok) throw new Error(r.status);
  return r.json();
}
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function demoRows() {
  const r = rng(42), today = kstToday(), out = [];
  Object.keys(CC_NAME).forEach((cc, ci) => {
    const bias = (r() - .5) * .22;
    for (let k = 29; k >= 0; k--) {
      const day = addDays(today, -k), wave = Math.sin((k + ci) / 4) * .06, tot = 25;
      let neg = Math.max(2, Math.round(tot * (.3 + bias * -1 + wave + (r() - .5) * .12))), pos = Math.max(2, Math.round(tot * (.3 + bias + (r() - .5) * .12 - wave)));
      const neu = Math.max(0, tot - neg - pos), w = () => Math.round(40000 + r() * 400000);
      out.push({ day, cc, pos_n:pos, neu_n:neu, neg_n:neg, pos_t:pos * w(), neu_t:neu * w() * .6 | 0, neg_t:neg * w() });
    }
  });
  return out;
}
const DEMO_POS = ['월드시리즈 우승', '신형 스마트폰 출시', '가을 축제 개막', '국가대표 4강 진출', '노벨상 수상 소식', '신메뉴 출시', '콘서트 티켓팅', '주가 사상 최고'];
const DEMO_NEG = ['폭우 경보', '대형 화재 속보', '항공편 대규모 결항', '물가 급등', '교통사고 소식', '정전 사태', '감염병 확산', '공장 파업'];
function demoTerms(day) {
  const r = rng(day.split('-').join('') | 0), ccs = Object.keys(CC_NAME), pick = a => a[Math.floor(r() * a.length)];
  const mk = (pool, s) => Array.from({ length:12 }, () => ({ cc:pick(ccs), term:pick(pool), traffic:Math.round(20000 + r() * 900000), sentiment:s, headline:'(샘플) 관련 기사 제목이 여기에 표시돼요' })).sort((a, b) => b.traffic - a.traffic);
  return [...mk(DEMO_POS, 'positive'), ...mk(DEMO_NEG, 'negative')];
}
async function termsFor(day) {
  if (S.terms[day]) return S.terms[day];
  let v = [];
  try { v = S.mode === 'demo' ? demoTerms(day) : await sbGet(`sentiment_daily?select=cc,term,traffic,sentiment,headline&day=eq.${day}&sentiment=in.(positive,negative)&order=traffic.desc&limit=400`); } catch (e) { v = []; }
  return (S.terms[day] = v);
}

/* ---------- 집계 ---------- */
const days = () => [...new Set(S.rows.map(r => r.day))].sort().slice(-S.range);
function agg(day, cc = S.cc) {
  const k = S.basis === 'n' ? '_n' : '_t', o = { pos:0, neu:0, neg:0 };
  S.rows.forEach(r => { if (r.day === day && (cc === 'all' || r.cc === cc)) { o.pos += +r['pos' + k]; o.neu += +r['neu' + k]; o.neg += +r['neg' + k]; } });
  o.tot = o.pos + o.neu + o.neg; o.P = pc(o.pos, o.tot); o.U = pc(o.neu, o.tot); o.N = pc(o.neg, o.tot); o.net = o.P - o.N;
  return o;
}
const mood = net => net >= 10 ? '대체로 밝은 하루' : net <= -10 ? '무거운 소식이 많은 하루' : '밝은 소식과 무거운 소식이 비슷해요';

/* ---------- 툴팁 ---------- */
const tip = $('#tip');
function showTip(html, x, y) {
  tip.innerHTML = html; tip.style.display = 'block';
  const w = tip.offsetWidth, h = tip.offsetHeight;
  tip.style.left = Math.max(8, Math.min(innerWidth - w - 8, x + 14)) + 'px';
  tip.style.top = Math.max(8, Math.min(innerHeight - h - 8, y - h - 10)) + 'px';
}
const hideTip = () => { tip.style.display = 'none'; };

/* ---------- 그리기 ---------- */
function kpiHTML(d, prev) {
  const a = agg(d), p = prev ? agg(prev) : null;
  const dl = (cur, old) => p ? `${cur - old >= 0.05 ? '▲' : cur - old <= -0.05 ? '▼' : '–'} 전날보다 ${Math.abs(cur - old).toFixed(1)}%p` : '비교할 전날 없음';
  const tile = (k, cls, label, val, cur, old) => `<div class="tile"><span class="k"><i class="sw" style="background:var(--${cls})"></i>${label}</span><span class="v tabnum">${f0(val)}</span><span class="d">${dl(cur, old)}</span></div>`;
  const seg = (cls, v, lab) => v >= 0.5 ? `<div class="${cls}" style="flex:${v}" title="${lab} ${f0(v)}">${v >= 9 ? lab + ' ' + f0(v) : v >= 5 ? f0(v) : ''}</div>` : '';
  return `<div class="card"><div class="head"><div><h2>${md(d)} 분위기${S.cc === 'all' ? '' : ' · ' + CC_NAME[S.cc]}</h2><p class="cap">검색어 ${S.basis === 'n' ? '수' : '검색량'} 기준 · 아래 추이에서 날짜를 눌러 바꿀 수 있어요</p></div></div>
    <div class="hero"><span class="big tabnum">${sgn(a.net)}</span><span class="mood">분위기 지수 · ${mood(a.net)}</span></div>
    <div class="bar" role="img" aria-label="긍정 ${f0(a.P)}, 중립 ${f0(a.U)}, 부정 ${f0(a.N)}">${seg('n', a.N, '부정')}${seg('u', a.U, '중립')}${seg('p', a.P, '긍정')}</div>
    <div class="tiles">${tile('', 'neg', '부정', a.N, a.N, p ? p.N : 0)}${tile('', 'neu', '중립', a.U, a.U, p ? p.U : 0)}${tile('', 'pos', '긍정', a.P, a.P, p ? p.P : 0)}</div></div>`;
}

let TW = 720, PR = 74; const TH = 250, PL = 38, PT = 14, PB = 26;
function trendHTML(ds) {
  const vals = ds.map(d => agg(d)), maxV = Math.max(20, Math.ceil(Math.max(...vals.map(v => Math.max(v.P, v.N))) / 10) * 10);
  const X = i => ds.length === 1 ? (PL + TW - PR) / 2 : PL + i * (TW - PL - PR) / (ds.length - 1), Y = v => PT + (1 - v / maxV) * (TH - PT - PB);
  const grid = [0, maxV / 2, maxV].map(t => `<line x1="${PL}" x2="${TW - PR}" y1="${Y(t)}" y2="${Y(t)}" stroke="${t ? 'var(--line)' : 'var(--axis)'}" stroke-width="1"/><text x="${PL - 8}" y="${Y(t) + 4}" text-anchor="end" font-size="11" fill="var(--mute)" class="tabnum">${t}%</text>`).join('');
  const step = Math.max(1, Math.ceil(ds.length / 6)), xl = ds.map((d, i) => ((i % step === 0 && (ds.length - 1 - i >= step || i === ds.length - 1)) || i === ds.length - 1) ? `<text x="${X(i)}" y="${TH - 6}" text-anchor="middle" font-size="11" fill="var(--mute)">${md(d)}</text>` : '').join('');
  const line = (key, col) => ds.length > 1 ? `<polyline fill="none" stroke="var(--${col})" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" points="${vals.map((v, i) => X(i) + ',' + Y(v[key])).join(' ')}"/>` : '';
  const si = ds.indexOf(S.sel), last = vals[vals.length - 1];
  const dot = (i, key, col) => `<circle cx="${X(i)}" cy="${Y(vals[i][key])}" r="4.5" fill="var(--${col})" stroke="var(--surface)" stroke-width="2"/>`;
  const endLab = (key, col, name, off) => `<text x="${TW - PR + 8}" y="${Y(last[key]) + off}" font-size="12" font-weight="700" fill="var(--ink)">${name} ${f0(last[key])}</text>`;
  const gap = Math.abs(Y(last.P) - Y(last.N)) < 14 ? 7 : 0;
  return `<div class="card"><div class="head"><div><h2>날짜별 추이</h2><p class="cap">그래프를 누르거나 손가락으로 움직여 날짜를 고르세요</p></div>
      <div class="legend"><span><i class="sw" style="background:var(--pos)"></i>긍정 비율</span><span><i class="sw" style="background:var(--neg)"></i>부정 비율</span></div></div>
    <svg class="chart" id="trend" viewBox="0 0 ${TW} ${TH}" role="img" aria-label="날짜별 긍정과 부정 비율 추이">${grid}${xl}
      ${si >= 0 ? `<line x1="${X(si)}" x2="${X(si)}" y1="${PT}" y2="${TH - PB}" stroke="var(--axis)" stroke-dasharray="3 3"/>` : ''}
      ${line('P', 'pos')}${line('N', 'neg')}
      ${ds.length === 1 ? dot(0, 'P', 'pos') + dot(0, 'N', 'neg') : si >= 0 ? dot(si, 'P', 'pos') + dot(si, 'N', 'neg') : ''}
      ${endLab('P', 'pos', '긍정', last.P >= last.N ? -gap : gap)}${endLab('N', 'neg', '부정', last.P >= last.N ? gap + 8 : -gap + 4)}
      <line id="xh" x1="0" x2="0" y1="${PT}" y2="${TH - PB}" stroke="var(--ink2)" stroke-width="1" style="display:none"/>
      <rect id="hit" x="${PL - 10}" y="0" width="${TW - PL - PR + 20}" height="${TH}" fill="transparent"/></svg>
    ${ds.length < 3 ? '<p class="hint">데이터가 쌓이면 추이가 더 또렷하게 보여요. (지금 ' + ds.length + '일치)</p>' : ''}
    <details><summary>표로 보기</summary><div class="tablewrap"><table><thead><tr><th>날짜</th><th>긍정</th><th>중립</th><th>부정</th><th>지수</th></tr></thead><tbody>
      ${[...ds].reverse().map(d => { const a = agg(d); return `<tr><td>${d}</td><td>${f0(a.P)}</td><td>${f0(a.U)}</td><td>${f0(a.N)}</td><td>${sgn(a.net)}</td></tr>`; }).join('')}</tbody></table></div></details></div>`;
}

function countryHTML(d) {
  const ccs = [...new Set(S.rows.filter(r => r.day === d).map(r => r.cc))];
  const list = ccs.map(cc => ({ cc, a: agg(d, cc) })).filter(x => x.a.tot).sort((x, y) => S.sort === 'neg' ? y.a.N - x.a.N : y.a.P - x.a.P);
  return `<div class="card"><div class="head"><div><h2>나라별 분위기 · ${md(d)}</h2><p class="cap">왼쪽부터 부정 · 중립 · 긍정, 오른쪽 숫자는 ${S.sort === 'neg' ? '부정' : '긍정'} 비율 · 나라를 누르면 그 나라만 봐요</p></div>
      <div class="seg" id="segSort"><button data-s="neg" aria-pressed="${S.sort === 'neg'}">부정 많은 순</button><button data-s="pos" aria-pressed="${S.sort === 'pos'}">긍정 많은 순</button></div></div>
    <div class="legend"><span><i class="sw" style="background:var(--neg)"></i>부정</span><span><i class="sw" style="background:var(--neu)"></i>중립</span><span><i class="sw" style="background:var(--pos)"></i>긍정</span></div>
    <div class="rows">${list.map(({ cc, a }) => `<div class="row" data-cc="${cc}"><span class="nm">${CC_NAME[cc] || cc}</span><div class="rbar" role="img" aria-label="${CC_NAME[cc]} 부정 ${f0(a.N)} 중립 ${f0(a.U)} 긍정 ${f0(a.P)}">${a.N > 0 ? `<div class="n" style="flex:${a.N}"></div>` : ''}${a.U > 0 ? `<div class="u" style="flex:${a.U}"></div>` : ''}${a.P > 0 ? `<div class="p" style="flex:${a.P}"></div>` : ''}</div><span class="fig tabnum">${f0(S.sort === 'neg' ? a.N : a.P)}</span></div>`).join('') || '<p class="hint">이 날짜의 데이터가 없어요.</p>'}</div></div>`;
}

function termsHTML(d, v) {
  const f = v.filter(x => S.cc === 'all' || x.cc === S.cc);
  const col = (s, title, col) => { const it = f.filter(x => x.sentiment === s).slice(0, 6);
    return `<div><div class="sec-h"><i class="sw" style="background:var(--${col})"></i>${title}</div><ul class="list">${it.map(x => `<li><span class="cc">${x.cc}</span><span class="t" title="${esc(x.term)}">${esc(x.term)}</span><span class="tr tabnum">${fmtT(+x.traffic)}</span>${x.headline ? `<span class="hl">${esc(x.headline)}</span>` : ''}</li>`).join('') || '<li><span class="hint" style="grid-column:1/4">해당하는 검색어가 없어요.</span></li>'}</ul></div>`; };
  return `<div class="card"><div class="head"><div><h2>${md(d)} 대표 검색어</h2><p class="cap">검색량이 큰 순서 · 근거가 된 뉴스 제목을 함께 보여줘요</p></div></div><div class="two">${col('positive', '긍정 소식', 'pos')}${col('negative', '부정 소식', 'neg')}</div></div>`;
}

async function render() {
  const app = $('#app');
  { const w = Math.round($('.wrap').clientWidth - 38); TW = Math.max(300, Math.min(720, w)); PR = TW < 480 ? 62 : 74; }
  $('#badge').textContent = S.mode === 'demo' ? '샘플 데이터 · 미리보기' : S.mode === 'live' ? '실제 데이터' : '';
  $('#badge').className = 'badge' + (S.mode === 'demo' ? ' demo' : '');
  $('#badge').hidden = S.mode === 'loading' || S.mode === 'empty';
  document.querySelectorAll('#segRange button').forEach(b => b.setAttribute('aria-pressed', +b.dataset.r === S.range));
  document.querySelectorAll('#segBasis button').forEach(b => b.setAttribute('aria-pressed', b.dataset.b === S.basis));
  if (S.mode === 'loading') { app.innerHTML = '<div class="card"><p class="hint">불러오는 중이에요…</p></div>'; return; }
  if (S.mode === 'empty') { app.innerHTML = `<div class="card"><div class="empty"><b>아직 모인 데이터가 없어요</b><span>자동 수집이 한 번 돌고 나면 여기에 분위기가 나타나요.<br>(15_sentiment.sql 실행 → 수집 실행 순서예요)</span><button class="btn" id="goDemo">샘플로 미리 보기</button></div></div>`; $('#goDemo').onclick = () => { S.mode = 'demo'; S.rows = demoRows(); S.sel = null; render(); }; return; }
  const ds = days(); if (!ds.length) { app.innerHTML = '<div class="card"><p class="hint">선택한 조건의 데이터가 없어요.</p></div>'; return; }
  if (!S.sel || !ds.includes(S.sel)) S.sel = ds[ds.length - 1];
  const prev = ds[ds.indexOf(S.sel) - 1] || null, token = (S.tok = (S.tok || 0) + 1);
  app.innerHTML = kpiHTML(S.sel, prev) + trendHTML(ds) + countryHTML(S.sel) + '<div id="termsSlot"></div>';
  bindTrend(ds); bindRows();
  document.querySelectorAll('#segSort button').forEach(b => b.onclick = () => { S.sort = b.dataset.s; render(); });
  const v = await termsFor(S.sel); if (token === S.tok) $('#termsSlot').innerHTML = termsHTML(S.sel, v);
}

function bindTrend(ds) {
  const svg = $('#trend'), hit = $('#hit'), xh = $('#xh'); if (!svg) return;
  const X = i => ds.length === 1 ? (PL + TW - PR) / 2 : PL + i * (TW - PL - PR) / (ds.length - 1);
  const idxAt = e => { const r = svg.getBoundingClientRect(), x = (e.clientX - r.left) / r.width * TW; let b = 0, bd = 1e9; ds.forEach((_, i) => { const d = Math.abs(X(i) - x); if (d < bd) { bd = d; b = i; } }); return b; };
  const move = e => { const i = idxAt(e), a = agg(ds[i]); xh.setAttribute('x1', X(i)); xh.setAttribute('x2', X(i)); xh.style.display = '';
    showTip(`<b>${ds[i]}</b><br>긍정 ${f0(a.P)} · 중립 ${f0(a.U)} · 부정 ${f0(a.N)}<br>지수 ${sgn(a.net)}%p`, e.clientX, e.clientY); };
  hit.addEventListener('pointermove', move); hit.addEventListener('pointerdown', move);
  hit.addEventListener('pointerleave', () => { xh.style.display = 'none'; hideTip(); });
  hit.addEventListener('click', e => { S.sel = ds[idxAt(e)]; hideTip(); render(); });
}
function bindRows() {
  document.querySelectorAll('.row').forEach(el => {
    const show = e => { const a = agg(S.sel, el.dataset.cc), k = S.basis === 'n' ? '건' : '';
      showTip(`<b>${CC_NAME[el.dataset.cc]}</b><br>부정 ${f0(a.N)} · 중립 ${f0(a.U)} · 긍정 ${f0(a.P)}<br>지수 ${sgn(a.net)}%p`, e.clientX, e.clientY); };
    el.addEventListener('pointermove', show); el.addEventListener('pointerleave', hideTip);
    el.addEventListener('click', () => { S.cc = S.cc === el.dataset.cc ? 'all' : el.dataset.cc; $('#selCc').value = S.cc; hideTip(); render(); });
  });
}

/* ---------- 시작 ---------- */
$('#selCc').innerHTML = '<option value="all">전체 나라</option>' + Object.entries(CC_NAME).map(([k, v]) => `<option value="${k}">${v}</option>`).join('');
$('#selCc').onchange = e => { S.cc = e.target.value; render(); };
$('#segRange').onclick = e => { const b = e.target.closest('button'); if (b) { S.range = +b.dataset.r; render(); } };
$('#segBasis').onclick = e => { const b = e.target.closest('button'); if (b) { S.basis = b.dataset.b; render(); } };
let _rw = 0; addEventListener('resize', () => { const w = $('.wrap').clientWidth; if (Math.abs(w - _rw) > 40 && S.mode !== 'loading') { _rw = w; render(); } });
(async () => {
  _rw = $('.wrap').clientWidth; render();
  const demo = new URLSearchParams(location.search).has('demo');
  if (demo) { S.mode = 'demo'; S.rows = demoRows(); return render(); }
  try {
    const rows = await sbGet(`sentiment_daily_stats?select=*&day=gte.${addDays(kstToday(), -35)}&order=day.asc&limit=1000`);
    if (!rows.length) { S.mode = 'empty'; } else { S.mode = 'live'; S.rows = rows; }
  } catch (e) { S.mode = 'demo'; S.rows = demoRows(); }   // 연결이 안 되면(미리보기·표 미생성) 샘플로 보여줘요
  render();
})();
</script>

</body>
</html>
