<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>지구 근황</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Unbounded:wght@700;800;900&family=Outfit:wght@600;700&display=swap">
<style>html,body{margin:0}body{font:14px system-ui,sans-serif}
/* 레이아웃: 한 손에 들어오는 세로 앱. 지구본이 주인공이고, 나머지는 큰 타이포와 가는 선으로만 말한다. */
:root {
  --bg:#E9ECF3; --paper:#F7F8FC; --ink:#11142B; --mute:#626883; --line:rgba(17,20,43,.13);
  --accent:#AEFF1C; --accent-ink:#4A7C00; --on-accent:#0B1A10; --hot:#FF4A2B; --on-hot:#FFFFFF; --outer:#DCE0EB;
  --g-ocean:#FDFDFF; --g-land:#B3BBD6; --g-grid:rgba(17,20,43,.07);
  --g-shade0:rgba(255,255,255,.65); --g-shade1:rgba(17,20,43,.13); --g-rim:rgba(17,20,43,.2); --shadow:rgba(17,20,43,.16);
  --f-display:'Anybody','Arial Narrow','Noto Sans KR',sans-serif;
  --f-body:'Noto Sans KR',system-ui,-apple-system,'Apple SD Gothic Neo',sans-serif;
  --f-mono:'DM Mono',ui-monospace,Menlo,monospace;
  --gutter:20px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:#0E1122; --paper:#171B33; --ink:#ECEEFA; --mute:#9AA0C0; --line:rgba(236,238,250,.14);
    --accent:#AEFF1C; --accent-ink:#AEFF1C; --on-accent:#0B1A10; --hot:#FF6A4D; --outer:#080A16;
    --g-ocean:#171C2A; --g-land:#4B5645; --g-edge:#D6FF7A; --g-grid:rgba(236,238,250,.07);
    --g-shade0:rgba(255,255,255,.08); --g-shade1:rgba(0,0,0,.38); --g-rim:rgba(236,238,250,.16); --shadow:rgba(0,0,0,.5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg:#0E1122; --paper:#171B33; --ink:#ECEEFA; --mute:#9AA0C0; --line:rgba(236,238,250,.14);
  --accent:#AEFF1C; --accent-ink:#AEFF1C; --on-accent:#0B1A10; --hot:#FF6A4D; --outer:#080A16;
  --g-ocean:#171C2A; --g-land:#4B5645; --g-edge:#D6FF7A; --g-grid:rgba(236,238,250,.07);
  --g-shade0:rgba(255,255,255,.08); --g-shade1:rgba(0,0,0,.38); --g-rim:rgba(236,238,250,.16); --shadow:rgba(0,0,0,.5);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing:border-box; }
html, body { height:100%; }
body { margin:0; background:var(--outer); color:var(--ink); font:400 14px/1.5 var(--f-body); -webkit-font-smoothing:antialiased; overflow:hidden; }
button { font:inherit; color:inherit; background:none; border:0; padding:0; cursor:pointer; text-align:inherit; -webkit-tap-highlight-color:transparent; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, .pin:focus-visible { outline:2px solid var(--accent-ink); outline-offset:2px; }
h1,h2,h3,p { margin:0; }
.sr { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }

.app { height:100%; max-width:480px; margin:0 auto; display:flex; flex-direction:column; background:var(--bg); position:relative; overflow:hidden; }
@media (min-width:520px) { .app { border-inline:1px solid var(--line); } }
.views { flex:1; min-height:0; position:relative; }
.view { position:absolute; inset:0; overflow-y:auto; overflow-x:hidden; display:none; overscroll-behavior:contain; }
.view.on { display:block; }
.view-pad { padding:22px var(--gutter) 40px; }

/* ---------- 하단 내비게이션: 글자만으로 ---------- */
.nav { display:grid; grid-template-columns:repeat(5,1fr); border-top:1px solid var(--line); background:var(--bg); padding:2px 6px 4px; }
.nav button { padding:13px 0 11px; text-align:center; font:700 12px/1 var(--f-display); font-stretch:75%; letter-spacing:.12em; color:var(--mute); position:relative; }
.nav button[aria-current="page"] { color:var(--ink); }
.nav button[aria-current="page"]::before { content:''; position:absolute; left:50%; top:3px; width:5px; height:5px; margin-left:-2.5px; border-radius:50%; background:var(--accent-ink); }
.nav .count { font:500 9px var(--f-mono); margin-left:3px; color:var(--accent-ink); letter-spacing:0; vertical-align:top; }

/* ---------- 공통 조각 ---------- */
.eyebrow { font:500 10.5px/1 var(--f-mono); letter-spacing:.14em; text-transform:uppercase; color:var(--mute); }
.big { font:900 clamp(40px,13vw,58px)/.92 var(--f-display); font-stretch:62%; letter-spacing:-.01em; text-transform:uppercase; }
.sub { color:var(--mute); font-size:13px; margin-top:8px; }
.code { font:700 11px/1 var(--f-mono); letter-spacing:.08em; }
.tag { display:inline-flex; align-items:center; gap:5px; font:500 10px/1 var(--f-mono); letter-spacing:.1em; padding:4px 8px 3px; border-radius:999px; border:1px solid var(--line); color:var(--ink); white-space:nowrap; }
.tag--hot { background:var(--hot); border-color:var(--hot); color:var(--on-hot); }
.tag--rising { border-color:var(--ink); }
.tag--new { background:var(--accent); border-color:var(--accent); color:var(--on-accent); }
.tag--talked { color:var(--mute); border-style:dashed; }
.pill { display:inline-flex; align-items:center; gap:6px; height:34px; padding:0 14px; border-radius:999px; border:1px solid var(--line); font:700 13px var(--f-body); white-space:nowrap; }
.pill.on { background:var(--ink); color:var(--bg); border-color:var(--ink); }
.keep-btn { display:inline-flex; align-items:center; gap:6px; height:34px; padding:0 14px; border-radius:999px; border:1.5px solid var(--ink); font:800 13px var(--f-display); font-stretch:85%; letter-spacing:.06em; text-transform:uppercase; transition:transform .2s; white-space:nowrap; }
.keep-btn .plus { display:inline-block; transition:transform .35s cubic-bezier(.3,1.6,.5,1); font-weight:400; }
.keep-btn.on { background:var(--accent); border-color:var(--accent); color:var(--on-accent); }
.keep-btn.on .plus { transform:rotate(45deg) scale(0); width:0; margin-right:-6px; }
.keep-btn.pop { animation:pop .45s cubic-bezier(.3,1.6,.5,1); }
.keep-btn.sm { height:28px; padding:0 11px; font-size:11px; }
@keyframes pop { 0%{transform:scale(1)} 35%{transform:scale(1.18)} 100%{transform:scale(1)} }
@keyframes rise { from{opacity:0; transform:translateY(16px)} to{opacity:1; transform:none} }
@keyframes pulse { 0%{transform:scale(.6); opacity:.7} 100%{transform:scale(2.4); opacity:0} }
@keyframes pinpop { from{scale:.6} to{scale:1} }

.poster { display:block; width:100%; height:100%; }
.poster svg { display:block; width:100%; height:100%; }

/* ---------- HOME ---------- */
.home { position:absolute; inset:0; overflow:hidden; }
.home-head { position:absolute; left:0; right:0; top:0; padding:16px var(--gutter) 0; transition:opacity .35s, transform .6s cubic-bezier(.2,.8,.2,1); z-index:2; pointer-events:none; }
.has-sel .home-head { opacity:0; transform:translateY(-24px); }
.brand { display:flex; justify-content:space-between; align-items:baseline; }
.brand b { font:900 17px var(--f-body); letter-spacing:-.04em; }
.hero { margin-top:14px; font:900 clamp(30px,9.2vw,40px)/1.03 var(--f-body); letter-spacing:-.055em; }
.hero span { color:var(--accent-ink); display:block; }
.hint { margin-top:9px; font:500 11px var(--f-mono); letter-spacing:.06em; color:var(--mute); }

.stage { position:absolute; left:50%; top:var(--stageTop,150px); width:var(--S,340px); height:var(--S,340px); margin-left:calc(var(--S,340px) / -2); transform-origin:50% 0; transition:transform .7s cubic-bezier(.2,.8,.2,1); touch-action:none; user-select:none; -webkit-user-select:none; cursor:grab; z-index:1; }
.stage.drag { cursor:grabbing; }
.has-sel .stage { transform:translateY(var(--liftY,-120px)) scale(var(--liftScale,.62)); }
#globe { position:absolute; inset:0; width:100%; height:100%; display:block; }
.ring { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; animation:spin 90s linear infinite; }
.ring text { font:700 9.5px var(--f-display); font-stretch:75%; letter-spacing:.3em; fill:var(--mute); text-transform:uppercase; }
@keyframes spin { to { transform:rotate(360deg); } }

.pin { position:absolute; left:0; top:0; display:flex; align-items:center; gap:6px; padding:8px 9px; margin:-14px 0 0 -14px; border-radius:999px; color:var(--ink); will-change:transform; transition:opacity .2s; }
.pin i { width:9px; height:9px; border-radius:50%; background:var(--pc); box-shadow:0 0 0 2px var(--g-ocean); position:relative; flex:none; }
.pin i::after { content:''; position:absolute; inset:0; border-radius:50%; background:var(--pc); animation:pulse 2.2s ease-out infinite; }
.pin .pc { font:700 10px/1 var(--f-mono); letter-spacing:.08em; background:var(--g-ocean); padding:3px 5px 2px; border-radius:4px; box-shadow:0 0 0 1px var(--line); }
.pin .pn, .pin .pk { display:none; }
.pin.focus { z-index:5; background:var(--ink); color:var(--bg); padding:7px 12px 7px 9px; animation:pinpop .32s cubic-bezier(.3,1.5,.5,1) both; flex-wrap:wrap; max-width:190px; row-gap:1px; transform-origin:14px 50%; }
.pin.focus .pc { display:none; }
.pin.focus i { box-shadow:0 0 0 2px var(--ink); }
.pin.focus .pn { display:block; font:800 15px/1 var(--f-display); font-stretch:70%; letter-spacing:.04em; text-transform:uppercase; }
.pin.focus .pk { display:block; flex-basis:100%; font:700 11.5px/1.3 var(--f-body); opacity:.85; padding-left:15px; }
.pin.sel { z-index:6; }
.pin.sel:not(.focus) .pc { background:var(--ink); color:var(--bg); box-shadow:none; }

.dock { position:absolute; left:0; right:0; bottom:0; padding:0 var(--gutter) 14px; display:grid; gap:10px; transition:transform .5s cubic-bezier(.2,.8,.2,1), opacity .3s; z-index:3; }
.has-sel .dock { transform:translateY(130%); opacity:0; pointer-events:none; }
.rail { display:flex; gap:6px; overflow-x:auto; scrollbar-width:none; margin-inline:calc(var(--gutter) * -1); padding-inline:var(--gutter); }
.rail::-webkit-scrollbar { display:none; }
.chip { flex:none; display:inline-flex; align-items:center; gap:7px; padding:8px 12px 7px; border-radius:999px; border:1px solid var(--line); font:800 12.5px/1 var(--f-display); font-stretch:75%; letter-spacing:.1em; text-transform:uppercase; }
.chip i { width:7px; height:7px; border-radius:50%; background:var(--pc); }
.btn-surprise { height:52px; border-radius:999px; background:var(--ink); color:var(--bg); display:flex; align-items:center; justify-content:space-between; padding:0 22px; font:900 17px var(--f-display); font-stretch:75%; letter-spacing:.08em; text-transform:uppercase; }
.btn-surprise svg { width:22px; height:22px; }

/* ---------- 아래에서 올라오는 시트 ---------- */
.sheet { position:absolute; left:0; right:0; bottom:0; top:var(--sheetTop,300px); background:var(--paper); border-radius:24px 24px 0 0; box-shadow:0 -14px 44px var(--shadow); transform:translateY(106%); transition:transform .6s cubic-bezier(.2,.8,.2,1); display:flex; flex-direction:column; z-index:4; pointer-events:none; }
.sheet.open { transform:none; pointer-events:auto; }
.sheet-head { display:flex; justify-content:space-between; align-items:flex-end; gap:12px; padding:18px var(--gutter) 12px; }
.sheet-title { font:900 clamp(40px,12.5vw,54px)/.88 var(--f-display); font-stretch:62%; letter-spacing:-.005em; text-transform:uppercase; }
.sheet-meta { margin-top:9px; display:flex; flex-wrap:wrap; gap:4px 12px; font:500 10.5px var(--f-mono); letter-spacing:.08em; color:var(--mute); }
.sheet-ctl { display:flex; gap:6px; flex:none; }
.round { width:36px; height:36px; border-radius:50%; border:1px solid var(--line); display:grid; place-items:center; font:500 15px var(--f-mono); }
.kw-list { overflow-y:auto; padding:0 var(--gutter) 22px; flex:1; min-height:0; }
.kw { display:grid; grid-template-columns:1fr auto; gap:3px 12px; padding:14px 0 15px; border-top:1px solid var(--line); width:100%; opacity:0; }
.sheet.open .kw { animation:rise .55s cubic-bezier(.2,.8,.2,1) both; animation-delay:calc(var(--i) * 70ms + 260ms); }
.kw-title { font:900 clamp(23px,7vw,28px)/1.12 var(--f-body); letter-spacing:-.05em; display:flex; align-items:center; gap:9px; flex-wrap:wrap; }
.kw-desc { color:var(--mute); font-size:12.5px; grid-column:1; }
.kw-go { grid-row:1 / 3; grid-column:2; align-self:center; font:500 20px var(--f-mono); color:var(--accent-ink); }

.sp { padding:22px var(--gutter) 24px; display:flex; flex-direction:column; gap:6px; overflow-y:auto; flex:1; min-height:0; }
.sp-lead { font:800 17px/1.3 var(--f-body); letter-spacing:-.03em; }
.sp-city { font:500 11px var(--f-mono); letter-spacing:.1em; color:var(--mute); margin-top:14px; text-transform:uppercase; }
.sp-title { font:900 clamp(40px,12.5vw,56px)/.9 var(--f-display); font-stretch:62%; text-transform:uppercase; margin-top:4px; }
.sp-ko { font:900 20px var(--f-body); letter-spacing:-.04em; margin-top:6px; }
.sp-short { color:var(--mute); font-size:13px; margin-top:4px; }
.sp-btns { display:flex; flex-wrap:wrap; gap:8px; margin-top:18px; }
.sp-btns .main { height:44px; padding:0 20px; background:var(--accent); color:var(--on-accent); border-radius:999px; font:800 14px var(--f-body); }
.sp-btns .keep-btn, .sp-btns .pill { height:44px; }

.toast { position:absolute; left:50%; bottom:86px; transform:translate(-50%,20px); opacity:0; display:flex; align-items:center; gap:14px; background:var(--ink); color:var(--bg); padding:11px 16px; border-radius:999px; font:700 13px var(--f-body); z-index:60; pointer-events:none; transition:transform .35s cubic-bezier(.2,.8,.2,1), opacity .25s; white-space:nowrap; max-width:calc(100% - 32px); }
.toast.on { transform:translate(-50%,0); opacity:1; pointer-events:auto; }
.toast button { font:800 12px var(--f-display); font-stretch:80%; letter-spacing:.08em; text-transform:uppercase; color:var(--accent-ink); filter:brightness(1.25); }

@media (prefers-reduced-motion: reduce) {
  .ring, .pin i::after { animation:none; }
  .sheet, .stage, .home-head, .dock, .toast { transition-duration:.01ms; }
  .sheet.open .kw { animation:none; opacity:1; }
  .pin.focus { animation:none; }
}

/* ---------- DISCOVER / FOLLOWING ---------- */
.view-head { display:flex; justify-content:space-between; align-items:flex-end; gap:12px; }
.seg { display:flex; gap:22px; margin-top:20px; border-bottom:1px solid var(--line); }
.seg button { padding:0 0 11px; font:800 14px var(--f-display); font-stretch:80%; letter-spacing:.1em; color:var(--mute); text-transform:uppercase; position:relative; }
.seg button[aria-selected="true"] { color:var(--ink); }
.seg button[aria-selected="true"]::after { content:''; position:absolute; left:0; right:0; bottom:-1px; height:3px; background:var(--accent); }
.filters { display:flex; gap:6px; overflow-x:auto; scrollbar-width:none; margin:16px calc(var(--gutter) * -1) 0; padding:0 var(--gutter); }
.filters::-webkit-scrollbar { display:none; }
.feed { margin-top:6px; }
.fi { display:block; width:100%; padding:18px 0; border-bottom:1px solid var(--line); animation:rise .5s both; animation-delay:calc(var(--i) * 40ms); }
.fi-img { position:relative; aspect-ratio:4 / 3; max-width:100%; border-radius:6px; overflow:hidden; background:var(--paper); }
.fi-img .tag { position:absolute; left:10px; top:10px; background:var(--bg); }
.fi-img .tag--hot { background:var(--hot); }
.fi-img .tag--new { background:var(--accent); }
.fi-cc { position:absolute; right:12px; bottom:6px; font:900 64px/1 var(--f-display); font-stretch:50%; color:var(--cc-ink); opacity:.92; letter-spacing:-.01em; }
.fi-meta { display:flex; align-items:center; gap:8px; margin-top:12px; color:var(--mute); font:500 10.5px var(--f-mono); letter-spacing:.08em; text-transform:uppercase; }
.fi-title { margin-top:7px; font:900 clamp(26px,8vw,32px)/1.1 var(--f-body); letter-spacing:-.055em; }
.fi-desc { margin-top:6px; color:var(--mute); font-size:13.5px; }
.fi-foot { display:flex; justify-content:space-between; align-items:center; margin-top:12px; }
.fi-row { display:grid; grid-template-columns:1fr 92px; gap:14px; align-items:start; }
.fi-row .fi-img { aspect-ratio:1; border-radius:6px; }
.fi-row .fi-cc { font-size:34px; right:6px; bottom:2px; }
.fi-row .fi-title { font-size:23px; margin-top:6px; }
.more { width:100%; margin-top:20px; height:46px; border-radius:999px; border:1px solid var(--ink); text-align:center; font:800 13px var(--f-display); font-stretch:80%; letter-spacing:.12em; text-transform:uppercase; }

.up { padding:18px 0; border-bottom:1px solid var(--line); animation:rise .5s both; animation-delay:calc(var(--i) * 60ms); }
.up-lead { font:800 15px/1.35 var(--f-body); letter-spacing:-.035em; }
.up-lead em { font-style:normal; color:var(--accent-ink); }
.up-card { display:block; width:100%; margin-top:12px; padding:14px; border-radius:6px; background:var(--paper); }
.up-card b { display:block; font:700 15px/1.3 var(--f-body); letter-spacing:-.03em; }
.up-card span { display:block; margin-top:5px; color:var(--mute); font:500 10.5px var(--f-mono); letter-spacing:.06em; }
.divider { margin:26px 0 4px; display:flex; align-items:center; gap:12px; }
.divider::after { content:''; flex:1; height:1px; background:var(--line); }

.empty { padding:56px 0 20px; }
.empty p { font:800 20px/1.35 var(--f-body); letter-spacing:-.04em; max-width:15em; }
.empty .main { margin-top:20px; height:46px; padding:0 22px; border-radius:999px; background:var(--accent); color:var(--on-accent); font:800 14px var(--f-body); }

/* ---------- LOCAL ---------- */
.rail-cities { display:flex; gap:6px; overflow-x:auto; scrollbar-width:none; margin:18px calc(var(--gutter) * -1) 0; padding:0 var(--gutter); }
.rail-cities::-webkit-scrollbar { display:none; }
.sec { display:flex; justify-content:space-between; align-items:baseline; margin:30px 0 4px; }
.sec h2 { font:900 22px/1 var(--f-display); font-stretch:68%; letter-spacing:.02em; text-transform:uppercase; }
.sec .eyebrow { text-align:right; }
.mini { display:grid; grid-template-columns:1fr auto; align-items:center; gap:10px; padding:13px 0; border-bottom:1px solid var(--line); width:100%; }
.mini b { font:800 18px/1.2 var(--f-body); letter-spacing:-.045em; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.mini .go { font:500 17px var(--f-mono); color:var(--accent-ink); }
.share { width:100%; height:54px; margin-top:16px; border-radius:999px; background:var(--accent); color:var(--on-accent); display:flex; align-items:center; justify-content:space-between; padding:0 22px; font:800 15px var(--f-body); letter-spacing:-.02em; }
.share small { font:500 10.5px var(--f-mono); letter-spacing:.1em; text-transform:uppercase; opacity:.85; }
.pp { padding:18px 0; border-bottom:1px solid var(--line); animation:rise .5s both; animation-delay:calc(var(--i) * 50ms); }
.pp-img { aspect-ratio:5 / 4; border-radius:6px; overflow:hidden; background:var(--paper); }
.pp-img img { width:100%; height:100%; object-fit:cover; display:block; }
.pp-meta { margin-top:11px; display:flex; flex-wrap:wrap; gap:3px 10px; font:500 10.5px var(--f-mono); letter-spacing:.08em; text-transform:uppercase; color:var(--mute); }
.pp-meta .you { color:var(--accent-ink); }
.pp-title { margin-top:6px; font:900 22px/1.15 var(--f-body); letter-spacing:-.05em; }
.pp-text { margin-top:5px; color:var(--mute); font-size:13.5px; }
.pp-foot { margin-top:11px; display:flex; justify-content:space-between; align-items:center; font:500 11px var(--f-mono); color:var(--mute); }
.seen { display:inline-flex; align-items:center; gap:7px; height:30px; padding:0 12px; border-radius:999px; border:1px solid var(--line); font:700 12px var(--f-body); color:var(--ink); }
.seen.on { background:var(--ink); color:var(--bg); border-color:var(--ink); }
.seen.pop { animation:pop .4s cubic-bezier(.3,1.6,.5,1); }

/* ---------- KEEP ---------- */
.kp { position:relative; overflow:hidden; border-bottom:1px solid var(--line); animation:rise .5s both; animation-delay:calc(var(--i) * 50ms); }
.kp-del { position:absolute; right:0; top:0; bottom:0; width:96px; display:grid; place-items:center; background:var(--hot); color:var(--on-hot); font:800 12px var(--f-display); font-stretch:80%; letter-spacing:.1em; text-transform:uppercase; }
.kp-in { position:relative; background:var(--bg); display:grid; grid-template-columns:auto 1fr auto; gap:14px; align-items:center; padding:16px 0; touch-action:pan-y; transition:transform .25s cubic-bezier(.2,.8,.2,1); }
.kp-in.dragging { transition:none; }
.kp-cc { width:48px; height:48px; border-radius:50%; display:grid; place-items:center; font:900 17px var(--f-display); font-stretch:75%; letter-spacing:.04em; background:var(--cc-bg); color:var(--cc-ink); }
.kp-title { font:900 22px/1.15 var(--f-body); letter-spacing:-.05em; text-align:left; }
.kp-en { margin-top:2px; font:500 10.5px var(--f-mono); letter-spacing:.06em; color:var(--mute); text-transform:uppercase; }
.kp-x { width:34px; height:34px; border-radius:50%; border:1px solid var(--line); display:grid; place-items:center; font:400 16px var(--f-mono); color:var(--mute); }
.note { margin-top:22px; padding:12px 14px; border-radius:6px; background:var(--paper); color:var(--mute); font-size:12px; display:flex; gap:10px; align-items:center; }
.note b { font:500 10px var(--f-mono); letter-spacing:.1em; color:var(--accent-ink); flex:none; }

/* ---------- MY ---------- */
.me { display:flex; align-items:center; gap:14px; margin-top:20px; }
.avatar { width:62px; height:62px; border-radius:50%; background:var(--ink); color:var(--bg); display:grid; place-items:center; font:900 28px var(--f-display); font-stretch:60%; }
.me b { display:block; font:900 22px/1.1 var(--f-body); letter-spacing:-.05em; }
.stats { display:grid; grid-template-columns:repeat(3,1fr); margin-top:22px; border-block:1px solid var(--line); }
.stats div { padding:14px 0; }
.stats div + div { padding-left:14px; border-left:1px solid var(--line); }
.stats strong { display:block; font:900 36px/1 var(--f-display); font-stretch:62%; font-variant-numeric:tabular-nums; }
.visited { display:flex; flex-wrap:wrap; gap:6px; margin-top:12px; }
.visited span { font:700 11px/1 var(--f-mono); letter-spacing:.08em; padding:7px 9px 6px; border-radius:999px; border:1px dashed var(--line); color:var(--mute); }
.visited span.on { border:1px solid var(--cc-bg); background:var(--cc-bg); color:var(--cc-ink); }
.theme-seg { display:flex; gap:6px; margin-top:12px; }
.danger { margin-top:14px; height:42px; padding:0 16px; border-radius:999px; border:1px solid var(--line); font:700 13px var(--f-body); color:var(--mute); }
.my-post { display:grid; grid-template-columns:56px 1fr auto; gap:12px; align-items:center; padding:12px 0; border-bottom:1px solid var(--line); }
.my-post .th { width:56px; height:56px; border-radius:6px; overflow:hidden; background:var(--paper); }
.my-post .th img { width:100%; height:100%; object-fit:cover; display:block; }
.my-post b { display:block; font:800 16px/1.25 var(--f-body); letter-spacing:-.04em; }

/* ---------- 상세 화면 / 올리기 화면 ---------- */
.layer { position:absolute; inset:0; z-index:30; background:var(--bg); overflow-y:auto; overscroll-behavior:contain; transform:translateX(104%); transition:transform .5s cubic-bezier(.2,.8,.2,1); visibility:hidden; }
.layer.open { transform:none; visibility:visible; }
.layer.up-from { transform:translateY(104%); }
.layer.up-from.open { transform:none; }
.d-bar { position:sticky; top:0; z-index:5; display:flex; justify-content:space-between; align-items:center; padding:10px var(--gutter); background:color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); }
.back { display:inline-flex; align-items:center; gap:8px; height:36px; padding-right:8px; font:800 13px var(--f-display); font-stretch:80%; letter-spacing:.1em; text-transform:uppercase; }
.d-poster { position:relative; aspect-ratio:16 / 11; overflow:hidden; background:var(--paper); }
.d-cc { position:absolute; left:14px; bottom:-4px; font:900 clamp(96px,32vw,150px)/.84 var(--f-display); font-stretch:50%; color:var(--cc-ink); letter-spacing:-.02em; opacity:.95; }
.d-body { padding:20px var(--gutter) 48px; }
.d-meta { display:flex; align-items:center; flex-wrap:wrap; gap:8px 10px; font:500 11px var(--f-mono); letter-spacing:.08em; text-transform:uppercase; color:var(--mute); }
.d-title { margin-top:12px; font:900 clamp(40px,12.5vw,54px)/1.02 var(--f-body); letter-spacing:-.055em; word-spacing:.08em; }
.d-en { margin-top:6px; font:800 14px var(--f-display); font-stretch:75%; letter-spacing:.1em; text-transform:uppercase; color:var(--mute); }
.d-short { margin-top:18px; font:700 19px/1.4 var(--f-body); letter-spacing:-.04em; padding-left:14px; border-left:3px solid var(--accent); }
.d-sec { margin-top:34px; font:900 20px/1 var(--f-display); font-stretch:68%; letter-spacing:.03em; text-transform:uppercase; }
.why { display:flex; flex-wrap:wrap; gap:8px; margin-top:14px; }
.why span { padding:9px 14px; border-radius:999px; background:var(--ink); color:var(--bg); font:700 14px var(--f-body); letter-spacing:-.03em; }
.what { margin-top:8px; }
.what > div { padding:14px 0; border-bottom:1px solid var(--line); }
.what b { display:block; font:800 16px/1.3 var(--f-body); letter-spacing:-.04em; }
.what p { margin-top:4px; color:var(--mute); font-size:13.5px; }
.nw { display:grid; grid-template-columns:76px 1fr; gap:14px; width:100%; padding:14px 0; border-bottom:1px solid var(--line); align-items:start; }
.nw .th { width:76px; height:76px; border-radius:6px; overflow:hidden; }
.nw b { display:block; font:800 15.5px/1.3 var(--f-body); letter-spacing:-.04em; }
.nw .src { margin-top:4px; font:500 10.5px var(--f-mono); letter-spacing:.06em; color:var(--mute); }
.nw p { margin-top:4px; color:var(--mute); font-size:12.5px; }
.sample { display:inline-block; margin-left:8px; font:500 9px var(--f-mono); letter-spacing:.1em; padding:2px 6px; border:1px dashed var(--line); border-radius:4px; vertical-align:middle; color:var(--mute); }
.next { width:100%; margin-top:30px; padding:18px 0 0; border-top:2px solid var(--ink); display:flex; justify-content:space-between; align-items:flex-end; gap:12px; }
.next small { display:block; font:500 10.5px var(--f-mono); letter-spacing:.1em; color:var(--mute); text-transform:uppercase; }
.next b { display:block; margin-top:6px; font:900 26px/1.1 var(--f-body); letter-spacing:-.055em; }
.next .arrow { font:500 28px var(--f-mono); color:var(--accent-ink); }

/* 올리기 폼 */
.form { padding:6px var(--gutter) 40px; display:grid; gap:20px; }
.fld { display:grid; gap:8px; }
.fld > label, .fld > .lab { font:500 10.5px var(--f-mono); letter-spacing:.12em; text-transform:uppercase; color:var(--mute); display:flex; justify-content:space-between; }
.in { width:100%; box-sizing:border-box; background:transparent; border:0; border-bottom:2px solid var(--ink); border-radius:0; padding:8px 0 10px; color:var(--ink); font:800 22px/1.25 var(--f-body); letter-spacing:-.045em; }
.in.sm { font:600 16px/1.3 var(--f-body); letter-spacing:-.02em; border-bottom-width:1px; }
.in::placeholder { color:var(--mute); opacity:.6; font-weight:600; }
select.in { appearance:none; -webkit-appearance:none; background-image:linear-gradient(45deg,transparent 50%,var(--ink) 50%),linear-gradient(135deg,var(--ink) 50%,transparent 50%); background-position:calc(100% - 14px) 55%, calc(100% - 8px) 55%; background-size:6px 6px; background-repeat:no-repeat; }
textarea.in { resize:none; min-height:84px; font-size:17px; font-weight:600; border:1px solid var(--line); border-bottom:2px solid var(--ink); padding:10px 12px; border-radius:6px 6px 0 0; }
.cats { display:flex; flex-wrap:wrap; gap:6px; }
.photo { position:relative; aspect-ratio:5 / 3; border:1.5px dashed var(--mute); border-radius:6px; display:grid; place-items:center; text-align:center; color:var(--mute); overflow:hidden; cursor:pointer; }
.photo input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
.photo img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
.photo b { display:block; font:900 20px var(--f-body); letter-spacing:-.04em; color:var(--ink); }
.go-btn { height:54px; border-radius:999px; background:var(--accent); color:var(--on-accent); font:800 16px var(--f-body); text-align:center; }
.go-btn:disabled { background:var(--line); color:var(--mute); cursor:not-allowed; }

/* ---------- 뒤에 오는 보정 ---------- */
.hd { margin-top:10px; font:900 clamp(30px,9vw,38px)/1.08 var(--f-body); letter-spacing:-.06em; max-width:11em; text-wrap:balance; }
.fi-cc, .d-cc { color:var(--cc-bg); -webkit-text-stroke:2.5px var(--cc-fg); paint-order:stroke fill; }
.kp-cc { background:var(--cc-bg); color:var(--cc-fg); }
.visited span.on { border:1px solid var(--cc-bg); background:var(--cc-bg); color:var(--cc-fg); }
.kp-main { min-width:0; text-align:left; }
.stats strong small { font-weight:500; }
.view-pad .eyebrow + .hd { margin-top:12px; }
.fi:last-child { border-bottom:0; }
.sec h2 { font-weight:900; }
.sheet .kw:first-child { border-top:1px solid var(--line); }
.layer .d-bar .keep-btn { margin-left:auto; }
.photo div { padding:0 20px; font-size:12.5px; }
@media (max-height:640px) { .hero { font-size:28px; } .hint { display:none; } }

/* ---------- 흰 배경 + Pretendard ---------- */
:root {
  --bg:#FFFFFF; --paper:#F3F5F9; --outer:#EEF0F5; --line:rgba(17,20,43,.1);
  --g-ocean:#F4F8EC; --g-land:#CAD1BE; --g-edge:#5E9400; --g-shade0:rgba(255,255,255,.7); --g-shade1:rgba(17,20,43,.12);
  --f-display:'Pretendard Variable','Pretendard',-apple-system,BlinkMacSystemFont,'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  --f-body:var(--f-display); --f-mono:var(--f-display);
}
body, button, input, select, textarea { font-family:var(--f-body); }
.eyebrow, .code, .tag, .sheet-meta, .pp-meta, .fi-meta { font-variant-numeric:tabular-nums; }
.big, .sheet-title, .sp-title, .d-sec, .sec h2, .stats strong, .fi-cc, .d-cc, .kp-cc, .avatar { font-stretch:100%; letter-spacing:-.03em; }
.sheet-title, .sp-title { font-weight:900; line-height:.95; }
.fi-cc, .d-cc { letter-spacing:-.04em; }

/* 홈 상단: 가운데에 온 나라 이름 */
.focus-title { position:absolute; left:0; right:0; top:0; z-index:3; text-align:center; padding:18px 20px 0; pointer-events:none; transition:opacity .35s, transform .5s cubic-bezier(.2,.8,.2,1); }
.has-sel .focus-title { opacity:0; transform:translateY(-16px); }
#ft { font:900 clamp(50px,16vw,72px)/.95 var(--f-display); letter-spacing:-.04em; text-transform:uppercase; }
#fs { margin-top:8px; font:600 13px var(--f-body); color:var(--mute); letter-spacing:0; }
#ft.swap, #fs.swap { animation:rise .35s both; }

/* 하단 메뉴: 아이콘 + 라벨 */
.nav { padding:6px 6px 2px; }
.nav button { display:flex; flex-direction:column; align-items:center; gap:4px; padding:8px 0 7px; font:600 10.5px/1 var(--f-body); letter-spacing:.01em; text-transform:none; color:var(--mute); }
.nav button svg { width:24px; height:24px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
.nav button[aria-current="page"] { color:var(--ink); }
.nav button[aria-current="page"]::before { display:none; }
.nav button[aria-current="page"] svg { stroke:var(--accent-ink); }
.nav .count { position:absolute; top:3px; left:calc(50% + 6px); min-width:15px; height:15px; padding:0 4px; margin:0; border-radius:8px; background:var(--accent); color:var(--on-accent); font:700 9.5px/15px var(--f-body); font-style:normal; text-align:center; }
@media (max-height:640px) { #ft { font-size:44px; } }

.focus-title { z-index:0; }
#fs:empty { display:none; }

/* 전체 화면 스테이지: 지구본의 크기와 위치는 JS가 움직인다 */
.stage { left:0; top:0; width:100%; height:100%; margin:0; transform:none !important; transition:none; z-index:1; }
.stage #globe, .stage canvas { position:absolute; inset:0; width:100%; height:100%; display:block; }
#pins { position:absolute; inset:0; pointer-events:none; }
#pins .pin { pointer-events:auto; }
.dock { z-index:3; }

/* 상단 큰 제목: Monument Extended (없으면 비슷한 와이드 서체) */
#ft { font-family:'Monument Extended','Unbounded','Pretendard Variable','Pretendard',sans-serif; font-weight:800; font-size:clamp(34px,10.5vw,52px); letter-spacing:-.02em; line-height:1; }

/* 인스타 피드형 게시물 */
.ig-head { margin-top:28px; padding-top:18px; border-top:1px solid var(--line); display:flex; flex-direction:column; gap:3px; }
.ig-head span { font:800 12px var(--f-mono); letter-spacing:.12em; }
.ig-head small { font:500 12px var(--f-body); color:var(--mute); }
.ig-list { display:flex; flex-direction:column; margin:14px calc(var(--gutter) * -1) 0; }
.ig { padding:0 0 22px; }
.ig header { display:flex; align-items:center; gap:10px; padding:10px var(--gutter); }
.ig header > div { flex:1; min-width:0; display:flex; flex-direction:column; line-height:1.25; }
.ig header b { font:800 13px var(--f-body); letter-spacing:-.02em; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.ig header small { font:500 11px var(--f-body); color:var(--mute); }
.ig-av { width:34px; height:34px; border-radius:50%; flex:none; display:grid; place-items:center; background:var(--cc-bg, var(--ink)); color:var(--cc-fg, var(--bg)); font:900 14px var(--f-body); }
.ig-cat { font:600 10px var(--f-mono); letter-spacing:.06em; color:var(--mute); text-transform:uppercase; }
.ig-img { aspect-ratio:1 / 1; background:var(--paper); overflow:hidden; }
.ig-img img, .ig-img .poster { width:100%; height:100%; object-fit:cover; display:block; }
.ig-act { display:flex; align-items:center; justify-content:space-between; padding:10px var(--gutter) 0; font:500 11px var(--f-mono); color:var(--mute); }
.ig-cap { padding:8px var(--gutter) 0; font-size:13.5px; line-height:1.5; }
.ig-cap b { font-weight:800; margin-right:4px; }
.sp { padding-bottom:96px; }

/* 키워드별 가로 피드 */
.kwb { border-top:1px solid var(--line); opacity:0; padding-bottom:20px; }
.sheet.open .kwb { animation:rise .55s cubic-bezier(.2,.8,.2,1) both; animation-delay:calc(var(--i) * 70ms + 260ms); }
.kwb .kw { border-top:0; opacity:1; animation:none !important; }
.kf { display:flex; gap:12px; overflow-x:auto; scroll-snap-type:x mandatory; margin:12px calc(var(--gutter) * -1) 0; padding:0 var(--gutter) 4px; scroll-padding:0 var(--gutter); scrollbar-width:none; overscroll-behavior-x:contain; -webkit-overflow-scrolling:touch; }
.kf::-webkit-scrollbar { display:none; }
.kf-c { flex:none; width:min(80vw, 330px); scroll-snap-align:start; background:var(--bg); border-radius:14px; overflow:hidden; padding-bottom:14px; box-shadow:0 0 0 1px var(--line); }
.kf-c header { display:flex; align-items:center; gap:9px; padding:10px 12px; }
.kf-c header > div { flex:1; min-width:0; display:flex; flex-direction:column; line-height:1.25; }
.kf-c header b { font:800 13px var(--f-body); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.kf-c header small { font:500 11px var(--f-body); color:var(--mute); }
.kf-img { position:relative; aspect-ratio:4 / 5; background:var(--paper); overflow:hidden; }
.kf-img .poster { width:100%; height:100%; }
.kf-ph { position:absolute; left:12px; bottom:12px; right:12px; font:900 22px/1.1 var(--f-body); letter-spacing:-.04em; color:#fff; text-shadow:0 1px 14px rgba(0,0,0,.35); }
.kf-c .ig-act, .kf-c .ig-cap { padding-left:12px; padding-right:12px; }
.kf-c .ig-cap { display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
@media (prefers-reduced-motion: reduce) { .sheet.open .kwb { animation:none; opacity:1; } }
.kf-img svg, .ig-img svg { width:100%; height:100%; display:block; }

.pf-sub { color:var(--mute); font-size:13px; margin-top:-2px; }
.d-body .ig-list.pf { margin-left:calc(var(--gutter) * -1); margin-right:calc(var(--gutter) * -1); }

.pf-more { text-align:center; display:block; width:100%; height:48px; margin-top:4px; border:1px solid var(--line); border-radius:999px; font:800 14px var(--f-body); color:var(--ink); background:var(--bg); }
.pf-more:active { background:var(--paper); }
.share { margin-top:14px; }

/* Keep 버튼 위치 통일: 큰/작은 카드 모두 카드 오른쪽 아래 */
.fi-row .fi-foot { grid-column:1 / -1; margin-top:0; }
.fi-row { row-gap:12px; }
.fi-img svg { width:100%; height:100%; display:block; }

/* 한글 줄바꿈: 단어 중간에서 끊지 않고 어절 단위로 */
body, .view, .sheet, .layer, .nav { word-break:keep-all; overflow-wrap:break-word; line-break:strict; }
.hd, .sp-lead, .sp-ko, .kw-title, .fi-title, .pp-title, .d-title, .mini b, .kp-title, .up-lead, .ig-head small, .pf-sub { text-wrap:balance; }
.fi-desc, .kw-desc, .d-short, .pp-text, .sp-short, .ig-cap, .what p, .nw p, .empty p, .note span { text-wrap:pretty; }
.hd { max-width:15em; }

/* 상세 화면 플로팅 올리기 버튼 */
.fab-wrap { position:sticky; bottom:0; height:0; z-index:5; pointer-events:none; }
.fab { position:absolute; right:var(--gutter); bottom:calc(18px + env(safe-area-inset-bottom, 0px)); height:48px; padding:0 18px 0 14px; display:inline-flex; align-items:center; gap:8px; border-radius:999px; background:var(--accent); color:var(--on-accent); font:800 14px var(--f-body); letter-spacing:-.02em; box-shadow:0 8px 24px rgba(20,24,60,.28); pointer-events:auto; white-space:nowrap; }
.fab span { font:400 22px/1 var(--f-body); margin-top:-2px; }
.fab:active { transform:scale(.97); }

.cp-link { margin-top:8px; font:500 12px var(--f-body); color:var(--mute); }

/* 검색 */
.srch { display:flex; align-items:center; gap:10px; height:46px; margin-top:16px; padding:0 14px; border-radius:999px; background:var(--paper); color:var(--mute); }
.srch svg { width:18px; height:18px; flex:none; }
.srch input { flex:1; min-width:0; height:100%; background:transparent; border:0; outline:0; font:600 15px var(--f-body); color:var(--ink); letter-spacing:-.02em; -webkit-appearance:none; appearance:none; }
.srch input::placeholder { color:var(--mute); font-weight:500; }
.srch:focus-within { box-shadow:0 0 0 2px var(--ink); }
/* 내가 올린 글: 수정/삭제 */
.my-act { display:flex; align-items:center; gap:6px; }
.pill.sm { height:34px; padding:0 13px; font-size:12px; }
.kp-x.armed { width:auto; padding:0 12px; border-radius:999px; background:var(--hot); border-color:var(--hot); color:#fff; font:800 12px var(--f-body); }

/* 홈 하단: 나라 카드 + 서프라이즈 버튼 */
.dock { gap:12px; }
.rail { gap:8px; padding-block:4px; scroll-snap-type:x proximity; }
.chip { flex:none; scroll-snap-align:center; display:grid; grid-template-columns:auto 1fr; grid-template-rows:auto auto; column-gap:9px; row-gap:2px; align-items:center; width:132px; padding:10px 12px 10px 11px; border-radius:18px; border:1px solid var(--line); background:color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); text-align:left; letter-spacing:0; text-transform:none; font:inherit; transition:background .25s, color .25s, border-color .25s, transform .25s; }
.chip .cf { grid-row:1 / 3; font-size:26px; line-height:1; }
.chip .cn { font:900 12px/1.1 var(--f-body); letter-spacing:.06em; text-transform:uppercase; }
.chip .ck { font:600 11.5px/1.2 var(--f-body); color:var(--mute); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; letter-spacing:-.02em; }
.chip.on { background:var(--ink); border-color:var(--ink); color:var(--bg); transform:translateY(-3px); box-shadow:0 8px 20px var(--shadow); }
.chip.on .ck { color:color-mix(in srgb, var(--bg) 72%, transparent); }
.chip i { display:none; }
.btn-surprise { position:relative; height:64px; padding:0 18px 0 8px; gap:12px; justify-content:flex-start; overflow:hidden; background:linear-gradient(100deg, var(--ink) 0%, color-mix(in srgb, var(--ink) 78%, var(--accent)) 100%); font-stretch:100%; letter-spacing:0; text-transform:none; box-shadow:0 10px 28px color-mix(in srgb, var(--accent) 35%, transparent); }
.btn-surprise::after { content:''; position:absolute; inset:0; background:linear-gradient(110deg, transparent 35%, rgba(255,255,255,.22) 50%, transparent 65%); transform:translateX(-120%); animation:sheen 4.8s ease-in-out infinite; pointer-events:none; }
@keyframes sheen { 0%, 55% { transform:translateX(-120%); } 85%, 100% { transform:translateX(120%); } }
.sb-dice { width:48px; height:48px; flex:none; border-radius:16px; background:var(--accent); color:var(--on-accent); display:grid; place-items:center; transition:transform .4s cubic-bezier(.3,1.6,.5,1); }

    $('#rail').innerHTML = COUNTRIES.map(c => `<button class="chip t-${HEAT[c.cc].tier}" data-act="pick" data-cc="${c.cc}" style="--pc:${gcolor(c.cc)}"><span class="cf">${flag(c.cc)}</span><span class="cn">${c.name}</span><span class="ck">${esc(hotOf(c.cc).trendTitle)}</span></button>`).join('');
    $('#surpriseBtn').innerHTML = `<span class="sb-dice"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="8.5" cy="8.5" r="1.4" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.4" fill="currentColor" stroke="none"/><circle cx="15.5" cy="15.5" r="1.4" fill="currentColor" stroke="none"/></svg></span><span class="sb-txt"><b>SURPRISE ME</b><em id="sbSub"></em></span><span class="sb-go" aria-hidden="true">↻</span>`;
    startTease();
    renderNav(); applyTheme(state.theme);
    Globe.setPick(pickCountry);
    $('#stage').addEventListener('dblclick', () => { if (!state.sel) Globe.toggleZoom(); });
    new ResizeObserver(() => layoutHome()).observe(home);
    matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => Globe.readTheme());
    go('home');
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(layoutHome);
    restoreSession();
    setInterval(() => { const el = $('#shTime'); if (el && state.sel) el.textContent = localTime(CO[state.sel].tz); }, 30000);
  }
  return { init };
})();
App.init();

})();
</script></body></html>
